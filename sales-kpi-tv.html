<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="300">
    <title>MoJo Sales Arena — TV</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap');
        
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { width: 100%; min-height: 100%; overflow-x: hidden; }
        body { width: 100%; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
        
        :root {
            --mojo-green: #7AC142;
            --neon-green: #00ff88;
            --hot-pink: #ff2d78;
            --cancel-red: #ff4757;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --bg-dark: #0a0e1a;
            --bg-card: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --text-primary: #f0f4ff;
            --text-muted: #64748b;
            --purple: #a855f7;
            --blue: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse 800px 600px at 10% 20%, rgba(122,193,66,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 600px 400px at 90% 80%, rgba(255,45,120,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 50% 50%, rgba(59,130,246,0.04) 0%, transparent 70%);
            z-index: 0;
            animation: bgPulse 15s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Grid lines background */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .dashboard {
            position: relative;
            z-index: 1;
            width: min(100%, 1920px);
            min-height: 100vh;
            height: auto;
            margin: 0 auto;
            padding: clamp(10px, 1.4vw, 24px) clamp(12px, 1.6vw, 30px) clamp(12px, 1.2vw, 20px);
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1vw, 16px);
        }

        /* ===== HEADER ===== */
        .header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; min-height: 64px; gap: 16px; }
        .header-left { display: flex; align-items: center; gap: clamp(10px, 1vw, 18px); min-width: 0; }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 1.7vw, 32px);
            font-weight: 900;
            background: linear-gradient(135deg, var(--mojo-green), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(122,193,66,0.3);
            letter-spacing: 2px;
        }
        .logo-emoji { font-size: clamp(26px, 1.9vw, 36px); -webkit-text-fill-color: initial; }
        .arena-badge {
            background: linear-gradient(135deg, rgba(122,193,66,0.2), rgba(0,255,136,0.1));
            border: 1px solid rgba(122,193,66,0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-green);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: arenaPulse 3s ease-in-out infinite;
        }
        @keyframes arenaPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(122,193,66,0.2); }
            50% { box-shadow: 0 0 25px rgba(122,193,66,0.4); }
        }

        .header-right { display: flex; align-items: center; gap: clamp(12px, 1.25vw, 24px); flex-shrink: 0; }
        .live-clock {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 1.9vw, 36px);
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(240,244,255,0.2);
        }
        .live-date { font-size: 14px; color: var(--text-muted); text-align: right; }
        .pulse-dot {
            width: 10px; height: 10px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px var(--neon-green);
        }
        @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }

        /* ===== GLASS CARD ===== */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            transition: all 0.4s ease;
        }
        .glass:hover { border-color: rgba(255,255,255,0.12); }

        /* ===== MAIN CONTENT ===== */
        .content {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr);
            grid-template-rows: auto 1fr auto;
            gap: clamp(10px, 0.85vw, 16px);
            min-height: 0;
            overflow: visible;
        }

        .content > *, .metrics-row > *, .center-col, .right-col { min-width: 0; }

        /* ===== TOP METRICS ROW ===== */
        .metrics-row { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(8px, 0.75vw, 14px); }
        .metric-card {
            padding: clamp(12px, 0.95vw, 18px) clamp(10px, 0.85vw, 16px) clamp(10px, 0.75vw, 14px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 16px 16px 0 0;
        }
        .metric-card.sales::before { background: linear-gradient(90deg, var(--mojo-green), var(--neon-green)); }
        .metric-card.cancels::before { background: linear-gradient(90deg, var(--cancel-red), var(--hot-pink)); }
        .metric-card.net-pos::before { background: linear-gradient(90deg, var(--neon-green), #00ffcc); }
        .metric-card.net-neg::before { background: linear-gradient(90deg, var(--cancel-red), #ff6b6b); }
        .metric-card.pace::before { background: linear-gradient(90deg, var(--blue), var(--purple)); }
        .metric-card.neutral::before { background: linear-gradient(90deg, var(--gold), #ffaa00); }
        .metric-card.phone::before { background: linear-gradient(90deg, #06b6d4, var(--blue)); }
        
        .metric-label { font-size: clamp(9px, 0.58vw, 11px); color: var(--text-muted); text-transform: uppercase; letter-spacing: clamp(1px, 0.1vw, 2px); font-weight: 700; margin-bottom: 6px; }
        .metric-value {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(30px, 2.8vw, 54px);
            font-weight: 900;
            line-height: 1.1;
        }
        .metric-card.sales .metric-value { color: var(--mojo-green); text-shadow: 0 0 30px rgba(122,193,66,0.4); }
        .metric-card.cancels .metric-value { color: var(--cancel-red); text-shadow: 0 0 30px rgba(255,71,87,0.3); }
        .metric-card.net-pos .metric-value { color: var(--neon-green); text-shadow: 0 0 40px rgba(0,255,136,0.5); animation: greenGlow 2s ease-in-out infinite; }
        .metric-card.net-neg .metric-value { color: var(--cancel-red); text-shadow: 0 0 40px rgba(255,71,87,0.5); animation: redPulse 1.5s ease-in-out infinite; }
        .metric-card.pace .metric-value { color: var(--blue); text-shadow: 0 0 30px rgba(59,130,246,0.3); }
        .metric-card.neutral .metric-value { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .metric-card.phone .metric-value { color: #06b6d4; text-shadow: 0 0 30px rgba(6,182,212,0.35); }
        
        @keyframes greenGlow { 0%,100% { text-shadow: 0 0 30px rgba(0,255,136,0.4); } 50% { text-shadow: 0 0 60px rgba(0,255,136,0.7), 0 0 100px rgba(0,255,136,0.3); } }
        @keyframes redPulse { 0%,100% { text-shadow: 0 0 30px rgba(255,71,87,0.4); } 50% { text-shadow: 0 0 60px rgba(255,71,87,0.7); transform: scale(1.02); } }
        
        .metric-sub { font-size: clamp(10px, 0.65vw, 12px); color: var(--text-muted); margin-top: 4px; }

        /* ===== PODIUM / LEADERBOARD ===== */
        .podium-card {
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .podium-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--mojo-green));
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .section-title .emoji { font-size: 22px; }

        .podium-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }

        .podium-entry {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            animation: slideInLeft 0.6s ease-out both;
        }
        .podium-entry:nth-child(1) { animation-delay: 0.1s; }
        .podium-entry:nth-child(2) { animation-delay: 0.25s; }
        .podium-entry:nth-child(3) { animation-delay: 0.4s; }

        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

        .podium-entry.rank-1 {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.03));
            border: 1px solid rgba(255,215,0,0.25);
            box-shadow: 0 0 30px rgba(255,215,0,0.08);
        }
        .podium-entry.rank-2 {
            background: linear-gradient(135deg, rgba(192,192,192,0.1), rgba(192,192,192,0.02));
            border: 1px solid rgba(192,192,192,0.2);
        }
        .podium-entry.rank-3 {
            background: linear-gradient(135deg, rgba(205,127,50,0.1), rgba(205,127,50,0.02));
            border: 1px solid rgba(205,127,50,0.2);
        }

        .medal { font-size: 32px; flex-shrink: 0; }
        .podium-info { flex: 1; min-width: 0; }
        .podium-name {
            font-size: 22px;
            font-weight: 800;
            white-space: nowrap;
        }
        .podium-entry.rank-1 .podium-name { 
            background: linear-gradient(135deg, var(--gold), #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .podium-level {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .level-rookie { color: #94a3b8; }
        .level-closer { color: var(--blue); }
        .level-ace { color: var(--purple); }
        .level-legend { color: var(--gold); }

        .podium-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--mojo-green);
            text-shadow: 0 0 20px rgba(122,193,66,0.3);
            flex-shrink: 0;
        }
        .podium-net {
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 8px;
        }
        .podium-net.positive { color: var(--neon-green); background: rgba(0,255,136,0.1); }
        .podium-net.negative { color: var(--cancel-red); background: rgba(255,71,87,0.1); }

        /* XP Bar */
        .xp-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .xp-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, var(--mojo-green), var(--neon-green));
        }
        .xp-text { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        /* ===== CENTER COLUMN ===== */
        .center-col { display: flex; flex-direction: column; gap: 14px; }

        /* Challenge Card */
        .challenge-card {
            padding: 18px 22px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .challenge-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--purple), var(--hot-pink), var(--gold));
        }
        .challenge-icon { font-size: 32px; margin-bottom: 6px; }
        .challenge-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--purple);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .challenge-text {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.3;
            background: linear-gradient(135deg, #fff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Weekly Leaderboard */
        .weekly-card {
            padding: 18px 22px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .weekly-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }
        .weekly-list { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .weekly-entry {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .weekly-rank { font-size: 22px; width: 36px; text-align: center; }
        .weekly-name { flex: 1; font-size: 18px; font-weight: 700; }
        .weekly-sales {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--mojo-green);
        }

        /* Streaks */
        .streaks-card {
            padding: 18px 22px;
            position: relative;
            overflow: hidden;
        }
        .streaks-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff6b35, #ff2d78, #ffd700);
        }
        .streak-list { display: flex; flex-direction: column; gap: 8px; }
        .streak-entry {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
        }
        .streak-fire { font-size: 24px; animation: fireFlicker 0.5s ease-in-out infinite alternate; }
        @keyframes fireFlicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.1) rotate(3deg); } }
        .streak-name { font-size: 16px; font-weight: 700; flex: 1; }
        .streak-count {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #ff6b35;
            text-shadow: 0 0 15px rgba(255,107,53,0.4);
        }
        .streak-label { font-size: 11px; color: var(--text-muted); }

        /* ===== RIGHT COLUMN ===== */
        .right-col { display: flex; flex-direction: column; gap: 14px; }

        /* Badges */
        .badges-card {
            padding: 18px 22px;
            position: relative;
            overflow: hidden;
        }
        .badges-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--purple), var(--hot-pink));
        }
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .badge-item {
            text-align: center;
            padding: 10px 4px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .badge-item.unlocked {
            border-color: rgba(255,215,0,0.3);
            background: rgba(255,215,0,0.05);
            animation: badgeGlow 3s ease-in-out infinite;
        }
        .badge-item.locked { opacity: 0.3; filter: grayscale(1); }
        @keyframes badgeGlow { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 15px rgba(255,215,0,0.15); } }
        .badge-emoji { font-size: 28px; margin-bottom: 4px; }
        .badge-name { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.2; }

        /* Revenue Pace */
        .pace-card {
            padding: 18px 22px;
            position: relative;
            overflow: hidden;
        }
        .pace-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--mojo-green), var(--blue));
        }
        .pace-big-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            text-align: center;
            margin: 8px 0;
        }
        .pace-bar-wrap {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin: 10px 0;
        }
        .pace-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .pace-bar-fill.on-pace { background: linear-gradient(90deg, var(--mojo-green), var(--neon-green)); }
        .pace-bar-fill.behind { background: linear-gradient(90deg, #f59e0b, var(--cancel-red)); }
        .pace-marker {
            position: absolute;
            top: -6px;
            bottom: -6px;
            width: 3px;
            background: white;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        .pace-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

        /* Phone Performance */
        .phone-card {
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }
        .phone-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #06b6d4, var(--blue));
        }
        .phone-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }
        .phone-stat {
            min-height: 68px;
            border-radius: 12px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px 12px;
        }
        .phone-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 1.6vw, 28px);
            font-weight: 800;
            color: #06b6d4;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .phone-stat-label {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .phone-leader-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .phone-leader-name {
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .phone-leader-label {
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .phone-leader-value {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .phone-empty {
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
        }

        /* Cancel Reasons */
        .cancel-card {
            padding: 18px 22px;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .cancel-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--cancel-red), var(--hot-pink));
        }
        .reason-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .reason-name { width: 110px; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reason-bar-wrap { flex: 1; height: 18px; background: rgba(255,255,255,0.06); border-radius: 9px; overflow: hidden; }
        .reason-bar-fill {
            height: 100%;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 10px;
            font-weight: 700;
            transition: width 1s ease;
        }
        .reason-count { width: 30px; text-align: right; font-size: 16px; font-weight: 800; color: var(--cancel-red); }

        /* ===== BOTTOM QUOTE BAR ===== */
        .quote-bar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            overflow: hidden;
        }
        .quote-bar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--mojo-green), var(--purple), var(--hot-pink), transparent);
        }
        .quote-icon { font-size: 24px; flex-shrink: 0; }
        .quote-text {
            font-size: 17px;
            font-weight: 600;
            font-style: italic;
            background: linear-gradient(90deg, var(--text-primary), #a5b4fc);

            -webkit-text-fill-color: transparent;

            animation: scrollQuote 20s linear infinite;

        @keyframes scrollQuote {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }

        /* ===== CONFETTI ===== */
        .confetti-container {

            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall 3s ease-in forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(1100px) rotate(720deg); opacity: 0; }
        }

        /* ===== SPARKLES ===== */
        .sparkle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--gold);
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.6s ease-out both; }

        /* Loading */
        .loading-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-dark);

            flex-direction: column; gap: 20px;
        }
        .loading-spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(122,193,66,0.2);
            border-top-color: var(--mojo-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--mojo-green); letter-spacing: 4px; }
    /* ===== RESPONSIVE: Iframe/Embedded (1200-1500px) ===== */
    @media (max-width: 1500px) {
        .header { flex-wrap: wrap; }
        .live-clock { font-size: 2rem; }
        .content { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 0.9fr); }
        .metric-value { font-size: clamp(2.4rem, 3.4vw, 3rem); }

    /* ===== RESPONSIVE: Mobile (<768px) ===== */
    @media (max-width: 767px) {

        .header-left, .header-right { justify-content: center; flex-wrap: wrap; }
        .header-left { flex-direction: column; gap: 4px; }
        .logo { font-size: 1.2rem; letter-spacing: 1px; }
        .arena-badge { font-size: 0.65rem; padding: 5px 10px; letter-spacing: 2px; }
        .live-clock { font-size: 1.3rem; }
        .live-date { text-align: center; }
        .content { grid-template-columns: 1fr; }
        .metrics-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .metric-value { font-size: 2rem; }
        .metric-label { font-size: 0.55rem; }

        .badge-emoji { font-size: 1.3rem; }
        .badge-name { font-size: 0.5rem; }

    }

    @media (max-width: 420px) {
        .metrics-row { grid-template-columns: 1fr; }
        .badge-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING ARENA</div>
    </div>
    <div class="confetti-container" id="confetti"></div>
    <div class="dashboard" id="dashboard" style="opacity: 0;"></div>

    <script>
    /* ===== CONFIG ===== */
    const DATA_URL = 'sales-kpi-data.json';
    const REFRESH_MS = 5 * 60 * 1000;
    const QUOTES = [
        "Every sale is a victory. Every 'no' is one step closer to 'yes.' 💪",
        "Champions don't wait for opportunities — they create them. 🏆",
        "The difference between ordinary and extraordinary is that little 'extra.' ✨",
        "Hustle beats talent when talent doesn't hustle. 🔥",
        "You miss 100% of the shots you don't take. — Wayne Gretzky 🏒",
        "Sales is not about selling anymore, but about building trust. 🤝",
        "Be so good they can't ignore you. — Steve Martin ⭐",
        "Success is the sum of small efforts repeated day in and day out. 📈",
        "The best salespeople are the best listeners. 👂",
        "Don't count the days. Make the days count. — Muhammad Ali 🥊",
        "Your vibe attracts your tribe — and your customers! 🦟💚",
        "First they watch. Then they compete. Then they WIN. 🏅",
        "Teamwork makes the dream work — but the scoreboard keeps it honest! 📊",
        "Today's effort = Tomorrow's results. Get after it! 🚀",
        "A goal without a plan is just a wish. Let's CRUSH it! 💥"
    ];
    const CHALLENGES = [
        { icon: '🎯', text: 'First to 3 sales today wins bragging rights!' },
        { icon: '🚀', text: 'Can the team hit {weeklyTarget} sales this week?' },
        { icon: '⚡', text: 'Beat yesterday\'s total — every sale counts!' },
        { icon: '🔥', text: 'Keep the streak alive! Don\'t break the chain!' },
        { icon: '💎', text: 'Close a Signature Program sale for bonus XP!' },
        { icon: '🎪', text: 'Hat Trick Challenge: Who gets 3 in one day?' },
        { icon: '🏆', text: 'Outsell your personal best this month!' },
        { icon: '👑', text: 'Top the leaderboard by Friday!' },
    ];
    const LEVELS = [
        { name: 'Rookie', min: 0, color: '#94a3b8', icon: '🌱' },
        { name: 'Closer', min: 10, color: '#3b82f6', icon: '🎯' },
        { name: 'Ace', min: 25, color: '#a855f7', icon: '⚡' },
        { name: 'Legend', min: 50, color: '#ffd700', icon: '👑' },
        { name: 'GOAT', min: 100, color: '#ff2d78', icon: '🐐' },
    ];
    const BADGES = [
        { id: 'first_sale', emoji: '🌅', name: 'First Blood', desc: 'Made a sale', check: (csr) => csr.sales >= 1 },
        { id: 'hat_trick', emoji: '🎩', name: 'Hat Trick', desc: '3+ sales in a period', check: (csr) => csr.sales >= 3 },
        { id: 'double_digits', emoji: '🔟', name: 'Double Digits', desc: '10+ sales', check: (csr) => csr.sales >= 10 },
        { id: 'net_positive', emoji: '📈', name: 'Net Positive', desc: 'More sales than cancels', check: (csr) => csr.sales > csr.cancels },
        { id: 'score_20', emoji: '🏅', name: '20 Club', desc: '20+ sales', check: (csr) => csr.sales >= 20 },
        { id: 'dominator', emoji: '💪', name: 'Dominator', desc: '25+ sales', check: (csr) => csr.sales >= 25 },
        { id: 'net_king', emoji: '👑', name: 'Net King', desc: 'Net +5 or better', check: (csr) => (csr.sales - csr.cancels) >= 5 },
        { id: 'legend', emoji: '🐐', name: 'Legend', desc: '50+ sales', check: (csr) => csr.sales >= 50 },
    ];

    /* ===== UTILITY ===== */
    function getLevel(sales) {
        let level = LEVELS[0];
        for (const l of LEVELS) {
            if (sales >= l.min) level = l;
        }
        return level;
    }
    function getXPProgress(sales) {
        const level = getLevel(sales);
        const idx = LEVELS.indexOf(level);
        const nextLevel = LEVELS[idx + 1];
        if (!nextLevel) return 100;
        const range = nextLevel.min - level.min;
        const progress = sales - level.min;
        return Math.min(100, Math.round((progress / range) * 100));
    }
    function getXPText(sales) {
        const level = getLevel(sales);
        const idx = LEVELS.indexOf(level);
        const nextLevel = LEVELS[idx + 1];
        if (!nextLevel) return `${sales} XP — MAX LEVEL`;
        return `${sales} / ${nextLevel.min} XP`;
    }

    function getDailyChallenge() {
        const today = new Date();
        const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
        const idx = seed % CHALLENGES.length;
        const c = CHALLENGES[idx];
        return { icon: c.icon, text: c.text.replace('{weeklyTarget}', '8') };
    }

    function getQuote() {
        const now = new Date();
        const minuteBlock = Math.floor(now.getMinutes() / 5);
        const seed = now.getFullYear() * 100000 + (now.getMonth()+1) * 1000 + now.getDate() * 10 + minuteBlock;
        return QUOTES[seed % QUOTES.length];
    }

    /* Simulated streak — based on weekly trend data */
    function getStreaks(csrs, weeklyTrend) {
        // Use weekly trend length and CSR position to create plausible streaks
        return csrs.map((csr, i) => {
            // Higher sales = higher streak (simulated)
            const streak = Math.max(1, Math.floor(csr.sales / 5));
            return { name: csr.name, streak: Math.min(streak, 12) };
        }).sort((a, b) => b.streak - a.streak);
    }

    /* ===== CLOCK ===== */
    function updateClock() {
        const now = new Date();
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');
        if (clockEl) clockEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
    setInterval(updateClock, 1000);

    /* ===== CONFETTI ===== */
    function launchConfetti(count = 60) {
        const container = document.getElementById('confetti');
        const colors = ['#7AC142', '#00ff88', '#ffd700', '#ff2d78', '#a855f7', '#3b82f6', '#ff6b35'];
        for (let i = 0; i < count; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDelay = Math.random() * 2 + 's';
            piece.style.animationDuration = (2 + Math.random() * 2) + 's';
            piece.style.width = (6 + Math.random() * 8) + 'px';
            piece.style.height = (6 + Math.random() * 8) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.transform = `rotate(${Math.random() * 360}deg)`;
            container.appendChild(piece);
        }
        setTimeout(() => { container.innerHTML = ''; }, 5000);
    }

    /* ===== RENDER ===== */
    let previousNet = null;

    async function loadDashboard() {
        try {
            const [res, salesRes, smRes, nextivaRes] = await Promise.all([
                fetch(DATA_URL + '?t=' + Date.now()),
                fetch('sales-data.json?t=' + Date.now()).catch(() => null),
                fetch('serviceminder-bridge-data.json?t=' + Date.now()).catch(() => null),
                fetch('nextiva-data.json?t=' + Date.now()).catch(() => null)
            ]);
            const data = await res.json();
            const salesData = salesRes && salesRes.ok ? await salesRes.json() : null;
            const serviceMinder = smRes && smRes.ok ? await smRes.json() : null;
            const nextiva = nextivaRes && nextivaRes.ok ? await nextivaRes.json() : null;
            applyServiceMinderHeadlines(data, salesData, serviceMinder);
            data.nextiva = nextiva;
            renderDashboard(data);
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboard').style.opacity = '1';
        } catch (err) {
            console.error('Failed to load:', err);
            document.getElementById('loadingScreen').innerHTML = `
                <div style="text-align:center;">
                    <div style="font-size:48px;margin-bottom:20px;">⚠️</div>
                    <div class="loading-text" style="color:var(--cancel-red);">DATA UNAVAILABLE</div>
                    <div style="color:var(--text-muted);margin-top:10px;">Retrying in 30 seconds...</div>
                </div>`;
            setTimeout(loadDashboard, 30000);
        }
    }

    function applyServiceMinderHeadlines(data, salesData, serviceMinder) {
        if (salesData?.csrs) data.csrs = salesData.csrs;
        if (!serviceMinder?.meta?.write_existing_applied) return;

        const smRevenue = serviceMinder.owners?.revenue || {};
        const smSalesKpi = serviceMinder.salesKpi || {};
        const officeSummary = salesData?.summary || data.summary || {};
        const invoices = (smSalesKpi.monthly || []).reduce((sum, row) => sum + (row.invoices || 0), 0);
        const now = new Date(serviceMinder.meta.generated_at || Date.now());
        const daysElapsed = Math.max(1, Math.ceil((now - new Date(now.getFullYear(), 0, 1)) / 86400000));
        const projectedAnnual = Math.round((smRevenue.ytd_invoiced || 0) / daysElapsed * 365);

        data.updated_at = salesData?.updated_at || data.updated_at;
        data.period = 'Office tally sales/cancels • SM invoice revenue';
        data.summary = {
            ...(data.summary || {}),
            total_sales: officeSummary.total_sales || 0,
            total_cancels: officeSummary.total_cancels || 0,
            total_revenue: smRevenue.ytd_invoiced || 0,
            total_invoices: invoices,
            net: officeSummary.net || 0,
            days_tracked: officeSummary.days_tracked || daysElapsed,
            revenue_per_day: Math.round((smRevenue.ytd_invoiced || 0) / daysElapsed)
        };
        data.cancels = {
            ...(data.cancels || {}),
            unique_accounts: officeSummary.total_cancels || 0,
            total_events: officeSummary.total_cancels || 0,
            by_reason: salesData?.cancel_reasons || data.cancels?.by_reason || []
        };
        data.revenue_pace = {
            ...(data.revenue_pace || {}),
            ytd_revenue: smRevenue.ytd_invoiced || 0,
            days_elapsed: daysElapsed,
            days_total: 365,
            projected_annual: projectedAnnual,
            target_annual: data.revenue_pace?.target_annual || 5000000,
            on_pace: projectedAnnual >= (data.revenue_pace?.target_annual || 5000000),
            pct_of_target: Number((projectedAnnual / (data.revenue_pace?.target_annual || 5000000) * 100).toFixed(1))
        };
    }

    function renderDashboard(data) {
        const s = data.summary;
        const csrs = data.csrs || [];
        const cancelReasons = (data.cancels && data.cancels.by_reason) || [];
        const revPace = data.revenue_pace || {};
        const weeklyTrend = data.weekly_trend || [];
        const nextiva = data.nextiva || null;

        // Calculate weekly sales from trend (last entry minus previous)
        let weeklySales = {};
        if (weeklyTrend.length >= 2) {
            const latest = weeklyTrend[weeklyTrend.length - 1];
            const prev = weeklyTrend[weeklyTrend.length - 2];
            // Approximate per-CSR weekly: distribute proportionally
            const weekTotal = latest.sales || 0;
            const totalSales = csrs.reduce((a, c) => a + c.sales, 0) || 1;
            csrs.forEach(c => {
                weeklySales[c.name] = Math.round((c.sales / totalSales) * weekTotal);
            });
        } else if (weeklyTrend.length === 1) {
            const weekTotal = weeklyTrend[0].sales || 0;
            const totalSales = csrs.reduce((a, c) => a + c.sales, 0) || 1;
            csrs.forEach(c => {
                weeklySales[c.name] = Math.round((c.sales / totalSales) * weekTotal);
            });
        }

        // Detect net change for confetti
        if (previousNet !== null && s.net > previousNet) {
            launchConfetti();
        }
        previousNet = s.net;

        const now = new Date();
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const daysLeft = lastDay - now.getDate();

        const challenge = getDailyChallenge();
        const quote = getQuote();
        const streaks = getStreaks(csrs, weeklyTrend);
        const medals = ['🥇', '🥈', '🥉'];

        // Sort CSRs by sales for leaderboard
        const sorted = [...csrs].sort((a, b) => b.sales - a.sales);

        // Revenue pace
        const pacePct = revPace.pct_of_target || 0;
        const daysElapsed = revPace.days_elapsed || 1;
        const daysTotal = revPace.days_total || 365;
        const expectedPct = Math.round((daysElapsed / daysTotal) * 100);
        const onPace = revPace.on_pace;
        const projectedStr = revPace.projected_annual ? '$' + (revPace.projected_annual / 1000000).toFixed(1) + 'M' : '—';
        const targetStr = revPace.target_annual ? '$' + (revPace.target_annual / 1000000).toFixed(0) + 'M' : '—';
        const ytdStr = revPace.ytd_revenue ? '$' + Math.round(revPace.ytd_revenue / 1000).toLocaleString() + 'K' : '—';
        const phoneReady = nextiva && nextiva.status === 'ready';
        const phoneSummary = nextiva?.summary || {};
        const phoneLeaders = nextiva?.leaders || {};
        const fmtSeconds = seconds => {
            if (seconds == null || Number.isNaN(Number(seconds))) return '—';
            const n = Math.round(Number(seconds));
            if (n < 60) return n + 's';
            return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
        };

        // Top 5 cancel reasons
        const topReasons = cancelReasons.slice(0, 5);
        const maxRC = topReasons.length > 0 ? topReasons[0].count : 1;
        const reasonColors = ['#ff4757', '#ff6b81', '#ff8a5c', '#ffa502', '#ffcc5c'];

        let html = `
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo"><span class="logo-emoji">🦟</span> MOJO SALES ARENA</div>
                <div class="arena-badge">⚡ LIVE</div>
            </div>
            <div class="header-right">
                <div>
                    <div class="live-clock" id="clock">--:--:--</div>
                    <div class="live-date" id="date"></div>
                </div>
                <div class="pulse-dot"></div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content">
            <!-- TOP METRICS -->
            <div class="metrics-row">
                <div class="glass metric-card sales fade-in-up" style="animation-delay:0.1s">
                    <div class="metric-label">🎯 Total Sales</div>
                    <div class="metric-value">${s.total_sales}</div>
                    <div class="metric-sub">YTD ${data.period ? '• ' + data.period.split(',')[0] : ''}</div>
                </div>
                <div class="glass metric-card cancels fade-in-up" style="animation-delay:0.15s">
                    <div class="metric-label">❌ Cancels</div>
                    <div class="metric-value">${s.total_cancels || (data.cancels && data.cancels.unique_accounts) || 0}</div>
                    <div class="metric-sub">Unique Accounts</div>
                </div>
                <div class="glass metric-card ${s.net >= 0 ? 'net-pos' : 'net-neg'} fade-in-up" style="animation-delay:0.2s">
                    <div class="metric-label">📊 Net Score</div>
                    <div class="metric-value">${s.net >= 0 ? '+' : ''}${s.net}</div>
                    <div class="metric-sub">${s.net >= 0 ? '🟢 Growing!' : '🔴 Need More Sales!'}</div>
                </div>
                <div class="glass metric-card pace fade-in-up" style="animation-delay:0.25s">
                    <div class="metric-label">💰 Revenue</div>
                    <div class="metric-value" style="font-size:40px;">${ytdStr}</div>
                    <div class="metric-sub">Pace: ${projectedStr} / ${targetStr}</div>
                </div>
                <div class="glass metric-card neutral fade-in-up" style="animation-delay:0.3s">
                    <div class="metric-label">⏳ Days Left</div>
                    <div class="metric-value">${daysLeft}</div>
                    <div class="metric-sub">This Month</div>
                </div>
                <div class="glass metric-card phone fade-in-up" style="animation-delay:0.32s">
                    <div class="metric-label">☎️ Answer Rate</div>
                    <div class="metric-value">${phoneReady ? phoneSummary.answer_rate.toFixed(0) + '%' : '—'}</div>
                    <div class="metric-sub">${phoneReady ? (phoneSummary.missed_calls || 0) + ' missed today' : 'Nextiva feed pending'}</div>
                </div>
            </div>

            <!-- LEFT: PODIUM -->
            <div class="glass podium-card fade-in-up" style="animation-delay:0.35s">
                <div class="section-title"><span class="emoji">🏆</span> SALES LEADERBOARD</div>
                <div class="podium-list">`;

        sorted.forEach((csr, i) => {
            const level = getLevel(csr.sales);
            const xpProg = getXPProgress(csr.sales);
            const xpTxt = getXPText(csr.sales);
            const net = csr.sales - csr.cancels;
            html += `
                    <div class="podium-entry rank-${i+1}">
                        <div class="medal">${medals[i] || ''}</div>
                        <div class="podium-info">
                            <div class="podium-name">${csr.name}</div>
                            <div class="podium-level level-${level.name.toLowerCase()}">${level.icon} ${level.name}</div>
                            <div class="xp-bar-wrap">
                                <div class="xp-bar-fill" style="width:${xpProg}%;${level.name === 'Legend' || level.name === 'GOAT' ? 'background:linear-gradient(90deg,#ffd700,#ff2d78);' : ''}"></div>
                            </div>
                            <div class="xp-text">${xpTxt}</div>
                        </div>
                        <div class="podium-score">${csr.sales}</div>
                        <div class="podium-net ${net >= 0 ? 'positive' : 'negative'}">${net >= 0 ? '+' : ''}${net}</div>
                    </div>`;
        });

        html += `
                </div>

                <!-- New Customer Counter -->
                <div class="glass fade-in-up" style="animation-delay:0.35s;margin-top:12px;padding:16px 20px;">
                    <div class="section-title"><span class="emoji">👥</span> ACTIVE CUSTOMER GOAL</div>
                    <div style="display:flex;align-items:center;gap:16px;margin-top:10px;">
                        <div style="flex:1;">
                            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                                <span style="font-family:'Orbitron',monospace;font-size:2rem;font-weight:700;color:#7AC142;">${data.active_customers?.toLocaleString() || '—'}</span>
                                <span style="font-family:'Orbitron',monospace;font-size:1.1rem;color:#64748b;align-self:flex-end;">/ ${(data.customer_goal || 1000).toLocaleString()} goal</span>
                            </div>
                            <div style="width:100%;height:18px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;position:relative;">
                                <div style="height:100%;border-radius:10px;background:linear-gradient(90deg,#7AC142,#4ade80);width:${Math.min(100, ((data.active_customers || 0) / (data.customer_goal || 1000)) * 100)}%;transition:width 1.5s ease;box-shadow:0 0 12px rgba(122,193,66,0.5);"></div>
                                ${((data.active_customers || 0) >= (data.customer_goal || 1000)) ? '<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,215,0,0.3),transparent);animation:shimmer 2s infinite;"></div>' : ''}
                            </div>
                            <div style="text-align:center;margin-top:6px;font-size:0.75rem;color:#94a3b8;">${((data.active_customers || 0) >= (data.customer_goal || 1000)) ? '🎉 GOAL REACHED!' : Math.round(((data.active_customers || 0) / (data.customer_goal || 1000)) * 100) + '% — ' + ((data.customer_goal || 1000) - (data.active_customers || 0)) + ' to go!'}</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- CENTER -->
            <div class="center-col">
                <!-- Daily Challenge -->
                <div class="glass challenge-card fade-in-up" style="animation-delay:0.4s">
                    <div class="challenge-icon">${challenge.icon}</div>
                    <div class="challenge-label">⚔️ DAILY CHALLENGE</div>
                    <div class="challenge-text">${challenge.text}</div>
                </div>

                <!-- Weekly Leaderboard -->
                <div class="glass weekly-card fade-in-up" style="animation-delay:0.45s">
                    <div class="section-title"><span class="emoji">📅</span> THIS WEEK</div>
                    <div class="weekly-list">`;

        const weeklySorted = [...csrs].sort((a, b) => (weeklySales[b.name] || 0) - (weeklySales[a.name] || 0));
        weeklySorted.forEach((csr, i) => {
            const ws = weeklySales[csr.name] || 0;
            html += `
                        <div class="weekly-entry">
                            <div class="weekly-rank">${medals[i] || (i+1)}</div>
                            <div class="weekly-name">${csr.name}</div>
                            <div class="weekly-sales">${ws}</div>
                        </div>`;
        });

        html += `
                    </div>
                </div>

                <!-- Streaks -->
                <div class="glass streaks-card fade-in-up" style="animation-delay:0.5s">
                    <div class="section-title"><span class="emoji">🔥</span> STREAKS</div>
                    <div class="streak-list">`;

        streaks.forEach(s => {
            const fires = '🔥'.repeat(Math.min(s.streak, 5));
            html += `
                        <div class="streak-entry">
                            <div class="streak-fire">🔥</div>
                            <div class="streak-name">${s.name}</div>
                            <div>
                                <div class="streak-count">${s.streak} days</div>
                                <div class="streak-label">${fires}</div>
                            </div>
                        </div>`;
        });

        html += `
                    </div>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="right-col">
                <!-- Phone Performance -->
                <div class="glass phone-card fade-in-up" style="animation-delay:0.53s">
                    <div class="section-title"><span class="emoji">☎️</span> PHONE SPEED</div>
                    ${phoneReady ? `
                    <div class="phone-grid">
                        <div class="phone-stat">
                            <div class="phone-stat-value">${phoneSummary.inbound_calls || 0}</div>
                            <div class="phone-stat-label">Inbound Calls</div>
                        </div>
                        <div class="phone-stat">
                            <div class="phone-stat-value">${phoneSummary.missed_calls || 0}</div>
                            <div class="phone-stat-label">Missed Calls</div>
                        </div>
                        <div class="phone-stat">
                            <div class="phone-stat-value">${fmtSeconds(phoneSummary.avg_answer_seconds)}</div>
                            <div class="phone-stat-label">Avg Answer</div>
                        </div>
                        <div class="phone-stat">
                            <div class="phone-stat-value">${phoneSummary.busiest_hour || '—'}</div>
                            <div class="phone-stat-label">Busiest Hour</div>
                        </div>
                    </div>
                    <div class="phone-leader-row">
                        <div>
                            <div class="phone-leader-name">${phoneLeaders.most_answered?.name || '—'}</div>
                            <div class="phone-leader-label">Most Pickups</div>
                        </div>
                        <div class="phone-leader-value">${phoneLeaders.most_answered?.answered ?? '—'}</div>
                    </div>
                    <div class="phone-leader-row">
                        <div>
                            <div class="phone-leader-name">${phoneLeaders.fastest_answer?.name || '—'}</div>
                            <div class="phone-leader-label">Fastest Avg Answer</div>
                        </div>
                        <div class="phone-leader-value">${fmtSeconds(phoneLeaders.fastest_answer?.avg_answer_seconds)}</div>
                    </div>` : `
                    <div class="phone-empty">
                        Waiting on the first scheduled Nextiva analytics export. Once the CSV lands, this panel will show traffic, missed calls, pickups, and answer speed.
                    </div>`}
                </div>

                <!-- Badges -->
                <div class="glass badges-card fade-in-up" style="animation-delay:0.55s">
                    <div class="section-title"><span class="emoji">🎖️</span> ACHIEVEMENTS</div>
                    <div class="badge-grid">`;

        // Check which badges are unlocked by any CSR
        BADGES.forEach(badge => {
            const unlocked = csrs.some(csr => badge.check(csr));
            const unlockedBy = csrs.filter(csr => badge.check(csr)).map(c => c.name);
            html += `
                        <div class="badge-item ${unlocked ? 'unlocked' : 'locked'}" title="${badge.desc}${unlocked ? ' — ' + unlockedBy.join(', ') : ''}">
                            <div class="badge-emoji">${badge.emoji}</div>
                            <div class="badge-name">${badge.name}</div>
                        </div>`;
        });

        html += `
                    </div>
                </div>

                <!-- Revenue Pace -->
                <div class="glass pace-card fade-in-up" style="animation-delay:0.6s">
                    <div class="section-title"><span class="emoji">🎯</span> REVENUE PACE</div>
                    <div class="pace-big-number" style="color:${onPace ? 'var(--mojo-green)' : 'var(--cancel-red)'};">
                        ${pacePct.toFixed(1)}%
                    </div>
                    <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:6px;">
                        ${onPace ? '✅ On pace for target' : '⚠️ Behind pace — projected ' + projectedStr}
                    </div>
                    <div class="pace-bar-wrap">
                        <div class="pace-bar-fill ${onPace ? 'on-pace' : 'behind'}" style="width:${Math.min(100, pacePct)}%;"></div>
                        <div class="pace-marker" style="left:${Math.min(100, expectedPct)}%;"></div>
                    </div>
                    <div class="pace-labels">
                        <span>$0</span>
                        <span>${targetStr} Target</span>
                    </div>
                </div>

                <!-- Cancel Reasons -->
                <div class="glass cancel-card fade-in-up" style="animation-delay:0.65s">
                    <div class="section-title"><span class="emoji">⚠️</span> CANCEL REASONS</div>`;

        topReasons.forEach((r, i) => {
            const pct = r.pct || 0;
            const barW = Math.max(8, (r.count / maxRC) * 100);
            html += `
                    <div class="reason-row">
                        <div class="reason-name">${r.name}</div>
                        <div class="reason-bar-wrap">
                            <div class="reason-bar-fill" style="width:${barW}%;background:${reasonColors[i] || '#ff4757'};">${pct}%</div>
                        </div>
                        <div class="reason-count">${r.count}</div>
                    </div>`;
        });

        html += `
                </div>
            </div>

            <!-- QUOTE BAR -->
            <div class="glass quote-bar fade-in-up" style="animation-delay:0.7s; position:relative;">
                <div class="quote-icon">💬</div>
                <div class="quote-text">${quote}</div>
            </div>
        </div>`;

        document.getElementById('dashboard').innerHTML = html;
        updateClock();

        // Launch confetti on first load if there are sales
        if (s.total_sales > 0 && previousNet === s.net) {
            setTimeout(() => launchConfetti(30), 1500);
        }
    }

    /* ===== INIT ===== */
    loadDashboard();
    setInterval(loadDashboard, REFRESH_MS);

    // Prevent screen sleep
    if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
    }
    </script>
    <script src="navigator.js"></script>
</body>
</html>
