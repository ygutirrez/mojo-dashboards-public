<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <title>MoJo Fleet Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .back-link { color: #666; text-decoration: none; font-size: 0.85rem; margin-bottom: 12px; display: inline-block; }
        .back-link:hover { color: #999; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 1.6rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .meta { color: #888; font-size: 0.85rem; text-align: right; }

        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .kpi-card { background: #1a1a2e; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.06); }
        .kpi-card .value { font-size: 1.8rem; font-weight: 700; }
        .kpi-card .label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .kpi-card .value.green { color: #22c55e; }
        .kpi-card .value.yellow { color: #f59e0b; }
        .kpi-card .value.red { color: #ef4444; }
        .kpi-card .value.blue { color: #38bdf8; }
        .kpi-card .value.purple { color: #a78bfa; }

        .section { margin-bottom: 32px; }
        .section h2 { font-size: 1rem; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        /* Vehicle table */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 12px; overflow: hidden; }
        thead th { background: #16213e; padding: 12px 14px; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; }
        tbody td { padding: 10px 14px; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        tbody tr:last-child td { border-bottom: none; }
        .safety-badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .safety-badge.excellent { background: rgba(34,197,94,0.15); color: #22c55e; }
        .safety-badge.good { background: rgba(56,189,248,0.15); color: #38bdf8; }
        .safety-badge.fair { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .safety-badge.poor { background: rgba(239,68,68,0.15); color: #ef4444; }

        /* Alerts */
        .alert-card { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .alert-card .alert-icon { font-size: 1.3rem; }
        .alert-card .alert-text { font-size: 0.85rem; }
        .alert-card .alert-text .driver { font-weight: 600; color: #ef4444; }

        /* Leaderboard */
        .leaderboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .lb-card { background: #1a1a2e; border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.06); }
        .lb-rank { font-size: 1.5rem; min-width: 36px; text-align: center; }
        .lb-info .lb-name { font-size: 0.9rem; font-weight: 600; }
        .lb-info .lb-detail { font-size: 0.75rem; color: #888; margin-top: 2px; }
        .lb-score { margin-left: auto; font-size: 1.2rem; font-weight: 700; }

        /* Chart */
        .chart-container { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.06); }
        .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 10px; }
        .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
        .bar { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; transition: height 0.3s; position: relative; }
        .bar.safety { background: linear-gradient(to top, #22c55e, #4ade80); }
        .bar.miles { background: linear-gradient(to top, #38bdf8, #818cf8); }
        .bar-label { font-size: 0.6rem; color: #666; margin-top: 6px; writing-mode: vertical-rl; text-orientation: mixed; max-height: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-value { font-size: 0.6rem; color: #aaa; margin-bottom: 3px; }
        .chart-legend { display: flex; gap: 20px; margin-top: 12px; justify-content: center; }
        .chart-legend span { font-size: 0.75rem; color: #888; display: flex; align-items: center; gap: 6px; }
        .chart-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

        .no-alerts { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 10px; padding: 16px; text-align: center; color: #22c55e; font-size: 0.9rem; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .kpi-row { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 480px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }

        .trend-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
        .trend-bar { flex: 1; border-radius: 3px 3px 0 0; min-width: 0; position: relative; cursor: default; }
        .trend-bar:hover::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; white-space: nowrap; z-index: 10; }
        .loading { text-align: center; padding: 60px; color: #64748b; font-size: 1.1rem; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Command Center</a>
    <div class="header">
        <h1>🚛 Fleet Dashboard</h1>
        <div class="meta">
            <div id="period">Loading...</div>
            <div>Zubie GPS Tracking | Auto-refresh: 5 min</div>
        </div>
    </div>

    <div id="content">
        <div class="loading">Loading fleet data...</div>
    </div>

    <script>
    async function loadData() {
        try {
            const res = await fetch('fleet-data.json');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            render(data);
        } catch (e) {
            document.getElementById('content').innerHTML = `
                <div class="loading">⚠️ Could not load fleet data: ${e.message}<br>
                <small style="color:#666">Ensure fleet-data.json is deployed to gh-pages</small></div>`;
        }
    }

    function safetyClass(score) {
        if (score >= 95) return 'excellent';
        if (score >= 85) return 'good';
        if (score >= 70) return 'fair';
        return 'poor';
    }

    function safetyColor(score) {
        if (score >= 95) return '#22c55e';
        if (score >= 85) return '#38bdf8';
        if (score >= 70) return '#f59e0b';
        return '#ef4444';
    }

    function render(data) {
        const s = data.summary;
        const safetyKpi = s.avg_safety_score >= 90 ? 'green' : s.avg_safety_score >= 75 ? 'yellow' : 'red';

        document.getElementById('period').textContent = `Data period: ${data.data_period}`;

        let html = '';

        // KPI Row
        html += `<div class="kpi-row">
            <div class="kpi-card"><div class="value blue">${s.active_vehicles}</div><div class="label">Active Trucks</div></div>
            <div class="kpi-card"><div class="value ${safetyKpi}">${s.avg_safety_score}</div><div class="label">Avg Safety Score</div></div>
            <div class="kpi-card"><div class="value purple">${s.total_miles.toLocaleString()}</div><div class="label">Total Miles</div></div>
            <div class="kpi-card"><div class="value blue">${s.total_trips.toLocaleString()}</div><div class="label">Total Trips</div></div>
            <div class="kpi-card"><div class="value">${s.total_drive_hours}</div><div class="label">Drive Hours</div></div>
            <div class="kpi-card"><div class="value ${s.total_speeding_events > 5000 ? 'red' : s.total_speeding_events > 2000 ? 'yellow' : 'green'}">${s.total_speeding_events.toLocaleString()}</div><div class="label">Speeding Events</div></div>
            <div class="kpi-card"><div class="value">${s.avg_miles_per_trip}</div><div class="label">Avg Mi / Trip</div></div>
            <div class="kpi-card"><div class="value ${s.total_hard_brakes > 50 ? 'red' : 'green'}">${s.total_hard_brakes}</div><div class="label">Hard Brakes</div></div>
        </div>`;

        // Safety Alerts
        html += `<div class="section"><h2>⚠️ Safety Alerts</h2>`;
        if (data.alerts && data.alerts.length > 0) {
            for (const a of data.alerts) {
                html += `<div class="alert-card">
                    <span class="alert-icon">🚨</span>
                    <div class="alert-text"><span class="driver">${a.driver}</span> (${a.truck}) — ${a.issue}: Safety score ${a.safety_score}, ${a.speeding_events.toLocaleString()} speeding events</div>
                </div>`;
            }
        } else {
            html += `<div class="no-alerts">✅ No safety alerts — all drivers above threshold</div>`;
        }
        html += `</div>`;

        // Two-column: Leaderboard + Safety Chart
        html += `<div class="grid-2">`;

        // Leaderboard
        html += `<div class="section"><h2>🏆 Safety Leaderboard</h2><div class="leaderboard">`;
        const sorted = [...data.vehicles].sort((a, b) => b.safety_score - a.safety_score).filter(v => v.driver !== 'Unassigned');
        sorted.slice(0, 8).forEach((v, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
            html += `<div class="lb-card">
                <div class="lb-rank">${medal}</div>
                <div class="lb-info">
                    <div class="lb-name">${v.driver}</div>
                    <div class="lb-detail">${v.truck} · ${v.miles} mi · ${v.trips} trips</div>
                </div>
                <div class="lb-score" style="color:${safetyColor(v.safety_score)}">${v.safety_score}</div>
            </div>`;
        });
        html += `</div></div>`;

        // Safety by Driver Bar Chart
        const drivers = data.vehicles.filter(v => v.driver !== 'Unassigned' && v.trips > 5);
        html += `<div class="section"><h2>📊 Safety Score by Driver</h2><div class="chart-container">`;
        html += `<div class="bar-chart">`;
        const maxMiles = Math.max(...drivers.map(v => v.miles), 1);
        drivers.sort((a, b) => b.safety_score - a.safety_score).forEach(v => {
            const safetyH = Math.max(v.safety_score * 1.5, 10);
            const milesH = Math.max((v.miles / maxMiles) * 150, 5);
            const firstName = v.driver.split(' ')[0];
            html += `<div class="bar-group">
                <div class="bar-value">${v.safety_score}</div>
                <div class="bar safety" style="height:${safetyH}px" title="${v.driver}: Safety ${v.safety_score}"></div>
                <div class="bar-label">${firstName}</div>
            </div>`;
        });
        html += `</div>`;
        html += `</div></div>`;

        html += `</div>`; // close grid-2

        // Historical Trend
        if (data.history && data.history.length > 1) {
            html += `<div class="section"><h2>📈 Weekly Trends</h2>`;
            html += `<div class="grid-2">`;

            // Safety trend
            html += `<div class="chart-container"><h3 style="font-size:0.8rem;color:#64748b;margin-bottom:12px">Avg Safety Score</h3><div class="trend-chart">`;
            const maxSafety = Math.max(...data.history.map(h => h.avg_safety), 100);
            const minSafety = Math.min(...data.history.map(h => h.avg_safety), 80);
            data.history.forEach(h => {
                const pct = ((h.avg_safety - minSafety + 5) / (maxSafety - minSafety + 10)) * 100;
                const color = safetyColor(h.avg_safety);
                html += `<div class="trend-bar" style="height:${Math.max(pct, 5)}%;background:${color}" data-tooltip="${h.date}: ${h.avg_safety}"></div>`;
            });
            html += `</div></div>`;

            // Miles trend
            html += `<div class="chart-container"><h3 style="font-size:0.8rem;color:#64748b;margin-bottom:12px">Total Miles / Week</h3><div class="trend-chart">`;
            const maxHistMiles = Math.max(...data.history.map(h => h.total_miles), 1);
            data.history.forEach(h => {
                const pct = (h.total_miles / maxHistMiles) * 100;
                html += `<div class="trend-bar" style="height:${Math.max(pct, 3)}%;background:linear-gradient(to top, #38bdf8, #818cf8)" data-tooltip="${h.date}: ${h.total_miles} mi"></div>`;
            });
            html += `</div></div>`;

            html += `</div></div>`;
        }

        // Vehicle Detail Table
        html += `<div class="section"><h2>🚐 Vehicle Details</h2>`;
        html += `<div class="table-wrapper"><table>
            <thead><tr>
                <th>Truck</th><th>Driver</th><th>Trips</th><th>Miles</th><th>Drive Hrs</th>
                <th>Safety</th><th>Speeding</th><th>Hard Brakes</th><th>Top Speed</th><th>Mi/Trip</th>
            </tr></thead><tbody>`;
        data.vehicles.forEach(v => {
            const sc = safetyClass(v.safety_score);
            html += `<tr>
                <td><strong>${v.truck}</strong></td>
                <td>${v.driver}</td>
                <td>${v.trips}</td>
                <td>${v.miles}</td>
                <td>${v.drive_hours}</td>
                <td><span class="safety-badge ${sc}">${v.safety_score}</span></td>
                <td style="color:${v.speeding_events > 1000 ? '#ef4444' : v.speeding_events > 500 ? '#f59e0b' : '#22c55e'}">${v.speeding_events.toLocaleString()}</td>
                <td>${v.hard_brakes}</td>
                <td>${v.top_speed} mph</td>
                <td>${v.miles_per_trip}</td>
            </tr>`;
        });
        html += `</tbody></table></div></div>`;

        // Footer
        html += `<div style="text-align:center;padding:20px;color:#475569;font-size:0.7rem">
            MoJo Fleet Dashboard — Zubie GPS Data · Updated: ${new Date(data.updated_at).toLocaleString()}
        </div>`;

        document.getElementById('content').innerHTML = html;
    }

    loadData();
    </script>
    <script src="navigator.js"></script>
</body>
</html>
