<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="120">
    <title>MoJo Data Quality Scorecard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .header .meta { text-align: right; font-size: 0.8rem; color: #64748b; }

        /* Score banner */
        .score-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 24px;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .score-ring {
            width: 120px;
            height: 120px;
            position: relative;
        }
        .score-ring svg { width: 120px; height: 120px; transform: rotate(-90deg); }
        .score-ring .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
        .score-ring .ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
        .score-ring .ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .score-ring .ring-value { font-size: 2rem; font-weight: 800; }
        .score-ring .ring-label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        .score-breakdown {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .score-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }
        .score-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Source Grid */
        .source-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .source-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .source-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--status-color, #64748b);
        }
        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .source-name {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .source-status {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .source-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .source-metric {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
        }
        .source-metric .val { font-size: 1.1rem; font-weight: 700; }
        .source-metric .lbl { font-size: 0.6rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        .source-detail {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.5;
        }

        /* Timeline */
        .timeline {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
        }
        .timeline h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 16px;
        }
        .tl-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            font-size: 0.8rem;
        }
        .tl-bar-track {
            flex: 1;
            height: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 3px;
            overflow: hidden;
        }
        .tl-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease;
        }

        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.7rem;
            padding: 20px 0 12px;
        }
        .footer a { color: #64748b; text-decoration: none; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #64748b;
        }
        .loading::after {
            content: '';
            width: 20px; height: 20px;
            border: 2px solid #64748b;
            border-top-color: transparent;
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .score-banner { flex-direction: column; gap: 20px; padding: 16px; }
            .source-grid { grid-template-columns: 1fr; }
            .source-metrics { grid-template-columns: repeat(3, 1fr); }
        }
            .back-link { display: inline-flex; align-items: center; gap: 6px; color: #60a5fa; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; transition: color 0.2s; }
        .back-link:hover { color: #93bbfc; }
    </style>
</head>
<body>
    <a href="hub.html" class="back-link">← Hub</a>
    <div class="header">
        <div>
            <h1>🔍 Data Quality <span style="color:#fbbf24;">Scorecard</span></h1>
            <div style="color:#64748b;font-size:0.85rem;margin-top:4px;">How fresh and reliable is each data source?</div>
        </div>
        <div class="meta">
            <div id="checkTime">Checking...</div>
        </div>
    </div>

    <div class="score-banner" id="scoreBanner">
        <div class="loading">Analyzing data quality</div>
    </div>

    <div class="source-grid" id="sourceGrid"></div>

    <div class="timeline" id="freshTimeline" style="display:none;">
        <h2>📊 Freshness Timeline — Hours Since Last Update</h2>
        <div id="timelineBars"></div>
    </div>

    <div class="footer">
        <a href="hub.html">← Back to Command Center</a> · Auto-refreshes every 2 minutes
    </div>

    <script>
    const DATA_SOURCES = [
        {
            name: 'ServSuite Reports',
            icon: '📋',
            files: ['dashboard-data.json', 'ops-data.json', 'tech-data.json'],
            description: 'Core business metrics from ServSuite XLSX exports',
            maxAgeHours: 28,
            critical: true
        },
        {
            name: 'Sales KPI',
            icon: '💰',
            files: ['sales-kpi-data.json'],
            description: 'Combined sales data from ServSuite + CSV imports',
            maxAgeHours: 28,
            critical: true
        },
        {
            name: 'Cancel Analysis',
            icon: '📉',
            files: ['cancel-analysis.json'],
            description: 'Cancellation patterns, win-back opportunities',
            maxAgeHours: 28,
            critical: true
        },
        {
            name: 'Retention',
            icon: '🔒',
            files: ['retention-data.json'],
            description: 'Customer retention rates and KPIs',
            maxAgeHours: 28,
            critical: false
        },
        {
            name: 'Fleet Tracking',
            icon: '🚛',
            files: ['fleet-data.json'],
            description: 'Zubie GPS fleet data',
            maxAgeHours: 36,
            critical: false
        },
        {
            name: 'Marketing',
            icon: '📣',
            files: ['marketing-data.json'],
            description: 'Google Ads, campaigns, marketing spend',
            maxAgeHours: 36,
            critical: false
        },
        {
            name: 'Chemical Data',
            icon: '🧪',
            files: ['chemical-data.json'],
            description: 'Chemical inventory, mix ratios, usage tracking',
            maxAgeHours: 48,
            critical: false
        },
        {
            name: 'Financial',
            icon: '📒',
            files: ['financial-data.json'],
            description: 'QuickBooks P&L data',
            maxAgeHours: 48,
            critical: false
        },
        {
            name: 'Pipeline Status',
            icon: '⚡',
            files: ['pipeline-status.json'],
            description: 'Nightly sync pipeline status',
            maxAgeHours: 28,
            critical: false
        },
        {
            name: 'ServiceMinder KPI',
            icon: '📊',
            files: ['sm-kpi-data.json'],
            description: 'ServiceMinder management metrics',
            maxAgeHours: 28,
            critical: false
        }
    ];

    async function checkAll() {
        const results = [];
        const now = Date.now();

        for (const src of DATA_SOURCES) {
            const fileResults = [];

            for (const file of src.files) {
                try {
                    const res = await fetch(file + '?t=' + now);
                    if (!res.ok) {
                        fileResults.push({ file, status: 'missing', ageHours: Infinity, size: 0 });
                        continue;
                    }

                    const lastModified = res.headers.get('last-modified');
                    const text = await res.text();
                    const size = text.length;

                    let ageHours = Infinity;
                    if (lastModified) {
                        ageHours = (now - new Date(lastModified).getTime()) / 3600000;
                    }

                    // Try to get timestamp from content
                    try {
                        const json = JSON.parse(text);
                        const ts = json.updated_at || json.generated_at || json.timestamp || json.last_updated;
                        if (ts) {
                            const contentAge = (now - new Date(ts).getTime()) / 3600000;
                            if (contentAge > 0 && contentAge < 720) { // Use content age if reasonable (<30 days)
                                ageHours = Math.min(ageHours, contentAge);
                            }
                        }
                    } catch(e) {}

                    // Validate JSON
                    let valid = true;
                    try { JSON.parse(text); } catch(e) { valid = false; }

                    fileResults.push({
                        file,
                        status: valid ? (ageHours <= src.maxAgeHours ? 'fresh' : 'stale') : 'invalid',
                        ageHours: Math.round(ageHours * 10) / 10,
                        size
                    });
                } catch(e) {
                    fileResults.push({ file, status: 'error', ageHours: Infinity, size: 0 });
                }
            }

            const worstStatus = fileResults.some(f => f.status === 'error' || f.status === 'missing') ? 'error'
                : fileResults.some(f => f.status === 'invalid') ? 'invalid'
                : fileResults.some(f => f.status === 'stale') ? 'stale'
                : 'fresh';

            const avgAge = fileResults.reduce((s, f) => s + (f.ageHours === Infinity ? 999 : f.ageHours), 0) / fileResults.length;
            const totalSize = fileResults.reduce((s, f) => s + f.size, 0);

            results.push({
                ...src,
                fileResults,
                overallStatus: worstStatus,
                avgAge: Math.round(avgAge * 10) / 10,
                totalSize
            });
        }

        render(results);
    }

    function render(results) {
        const now = new Date();
        document.getElementById('checkTime').textContent = 'Last check: ' + now.toLocaleTimeString();

        // Calculate overall score
        const fresh = results.filter(r => r.overallStatus === 'fresh').length;
        const stale = results.filter(r => r.overallStatus === 'stale').length;
        const errors = results.filter(r => ['error', 'missing', 'invalid'].includes(r.overallStatus)).length;
        const total = results.length;
        const score = Math.round((fresh / total) * 100);

        const scoreColor = score >= 80 ? '#22c55e' : score >= 60 ? '#f59e0b' : '#ef4444';

        // Score banner
        const circumference = 2 * Math.PI * 48;
        const offset = circumference - (score / 100) * circumference;

        document.getElementById('scoreBanner').innerHTML = `
            <div class="score-ring">
                <svg viewBox="0 0 120 120">
                    <circle class="ring-bg" cx="60" cy="60" r="48"/>
                    <circle class="ring-fill" cx="60" cy="60" r="48"
                        stroke="${scoreColor}"
                        stroke-dasharray="${circumference}"
                        stroke-dashoffset="${offset}"/>
                </svg>
                <div class="ring-text">
                    <div class="ring-value" style="color:${scoreColor}">${score}</div>
                    <div class="ring-label">Score</div>
                </div>
            </div>
            <div class="score-breakdown">
                <div class="score-item">
                    <div class="score-dot" style="background:#22c55e;"></div>
                    <span>${fresh} sources fresh</span>
                </div>
                <div class="score-item">
                    <div class="score-dot" style="background:#f59e0b;"></div>
                    <span>${stale} sources stale</span>
                </div>
                <div class="score-item">
                    <div class="score-dot" style="background:#ef4444;"></div>
                    <span>${errors} sources with errors</span>
                </div>
                <div class="score-item" style="color:#64748b;font-size:0.75rem;margin-top:4px;">
                    ${total} total data sources monitored
                </div>
            </div>
        `;

        // Source cards
        const grid = document.getElementById('sourceGrid');
        grid.innerHTML = '';

        const statusConfig = {
            fresh: { color: '#22c55e', bg: 'rgba(34,197,94,0.15)', label: '● Fresh' },
            stale: { color: '#f59e0b', bg: 'rgba(245,158,11,0.15)', label: '● Stale' },
            error: { color: '#ef4444', bg: 'rgba(239,68,68,0.15)', label: '● Error' },
            missing: { color: '#ef4444', bg: 'rgba(239,68,68,0.15)', label: '● Missing' },
            invalid: { color: '#ef4444', bg: 'rgba(239,68,68,0.15)', label: '● Invalid' }
        };

        // Sort: errors first, then stale, then fresh
        const sortOrder = { error: 0, missing: 0, invalid: 1, stale: 2, fresh: 3 };
        results.sort((a, b) => (sortOrder[a.overallStatus] || 3) - (sortOrder[b.overallStatus] || 3));

        results.forEach(r => {
            const cfg = statusConfig[r.overallStatus] || statusConfig.fresh;
            const card = document.createElement('div');
            card.className = 'source-card';
            card.style.setProperty('--status-color', cfg.color);

            const ageDisplay = r.avgAge >= 999 ? 'N/A' : r.avgAge < 1 ? '<1h' : r.avgAge.toFixed(0) + 'h';
            const sizeDisplay = r.totalSize > 1000000 ? (r.totalSize / 1000000).toFixed(1) + ' MB'
                : r.totalSize > 1000 ? (r.totalSize / 1000).toFixed(0) + ' KB'
                : r.totalSize + ' B';

            card.innerHTML = `
                <div class="source-header">
                    <div class="source-name">${r.icon} ${r.name}${r.critical ? ' ⭐' : ''}</div>
                    <div class="source-status" style="background:${cfg.bg};color:${cfg.color};">${cfg.label}</div>
                </div>
                <div class="source-metrics">
                    <div class="source-metric">
                        <div class="val" style="color:${cfg.color}">${ageDisplay}</div>
                        <div class="lbl">Age</div>
                    </div>
                    <div class="source-metric">
                        <div class="val">${r.files.length}</div>
                        <div class="lbl">Files</div>
                    </div>
                    <div class="source-metric">
                        <div class="val">${sizeDisplay}</div>
                        <div class="lbl">Size</div>
                    </div>
                </div>
                <div class="source-detail">${r.description}</div>
            `;

            grid.appendChild(card);
        });

        // Freshness timeline
        const timeline = document.getElementById('freshTimeline');
        const bars = document.getElementById('timelineBars');
        timeline.style.display = '';
        bars.innerHTML = '';

        const maxAge = Math.min(72, Math.max(...results.map(r => r.avgAge >= 999 ? 72 : r.avgAge)));

        results.forEach(r => {
            const cfg = statusConfig[r.overallStatus] || statusConfig.fresh;
            const ageDisplay = r.avgAge >= 999 ? 'N/A' : r.avgAge.toFixed(0) + 'h';
            const barWidth = r.avgAge >= 999 ? 100 : Math.min(100, (r.avgAge / maxAge) * 100);

            bars.innerHTML += `
                <div class="tl-row">
                    <span style="width:140px;flex-shrink:0;font-size:0.75rem;">${r.icon} ${r.name}</span>
                    <div class="tl-bar-track">
                        <div class="tl-bar-fill" style="width:${barWidth}%;background:${cfg.color};"></div>
                    </div>
                    <span style="width:40px;flex-shrink:0;text-align:right;font-size:0.75rem;color:${cfg.color};font-weight:600;">${ageDisplay}</span>
                </div>
            `;
        });
    }

    // Run check
    checkAll();
    </script>
    <script src="navigator.js"></script>
</body>
</html>
