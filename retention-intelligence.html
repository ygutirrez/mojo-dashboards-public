<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <title>MoJo Retention Intelligence</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.3rem; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .main-grid { grid-template-columns: 1fr !important; }
            .reason-bar-label { font-size: 0.7rem; }
            .waterfall-chart { overflow-x: auto; }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span { color: #ef4444; }
        .header .subtitle { color: #64748b; font-size: 0.85rem; margin-top: 4px; }
        .header .meta { text-align: right; font-size: 0.8rem; color: #64748b; }

        /* Alert Banner */
        .alert-banner {
            background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05));
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .alert-banner .icon { font-size: 1.5rem; }
        .alert-banner .text { flex: 1; min-width: 200px; }
        .alert-banner .text strong { color: #ef4444; }
        .alert-banner .metric {
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
            min-width: 100px;
        }
        .alert-banner .metric .value { font-size: 1.3rem; font-weight: 700; color: #ef4444; }
        .alert-banner .metric .label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent, #64748b);
        }
        .kpi-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .kpi-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent, #e2e8f0);
        }
        .kpi-card .detail {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card.full { grid-column: 1 / -1; }
        .card h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Reason Bars */
        .reason-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .reason-row:last-child { border-bottom: none; }
        .reason-bar-label {
            width: 160px;
            font-size: 0.8rem;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reason-bar-container {
            flex: 1;
            height: 24px;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            position: relative;
            margin: 0 12px;
        }
        .reason-bar-fill {
            height: 100%;
            border-radius: 4px;
            position: relative;
            transition: width 0.8s ease;
        }
        .reason-bar-fill.controllable { background: linear-gradient(90deg, #ef4444, #f97316); }
        .reason-bar-fill.uncontrollable { background: linear-gradient(90deg, #64748b, #94a3b8); }
        .reason-bar-fill.recoverable { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .reason-bar-value {
            width: 80px;
            text-align: right;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .reason-bar-tag {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .tag-recoverable { background: rgba(34,197,94,0.2); color: #22c55e; }
        .tag-controllable { background: rgba(239,68,68,0.2); color: #ef4444; }
        .tag-uncontrollable { background: rgba(100,116,139,0.2); color: #94a3b8; }

        /* Waterfall Chart */
        .waterfall-chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 200px;
            padding: 20px 0;
        }
        .wf-bar {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }
        .wf-bar .bar {
            width: 100%;
            max-width: 60px;
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: height 0.6s ease;
        }
        .wf-bar .bar.positive { background: linear-gradient(180deg, #22c55e, #16a34a); }
        .wf-bar .bar.negative { background: linear-gradient(180deg, #ef4444, #dc2626); }
        .wf-bar .bar.net { background: linear-gradient(180deg, #3b82f6, #2563eb); }
        .wf-bar .bar-value {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            text-align: center;
        }
        .wf-bar .bar-label {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 8px;
            text-align: center;
        }

        /* Lifetime Distribution */
        .lifetime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
        }
        .lifetime-item {
            text-align: center;
            padding: 12px 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .lifetime-item .count {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .lifetime-item .bucket {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 4px;
        }
        .lifetime-item .pct {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Win-Back Playbook */
        .playbook-item {
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--color, #64748b);
        }
        .playbook-item:last-child { margin-bottom: 0; }
        .playbook-item h3 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .playbook-item .desc {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        .playbook-item .impact {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Zip Code Heatmap */
        .zip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }
        .zip-item {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }
        .zip-item .zip { font-size: 1rem; font-weight: 700; }
        .zip-item .zip-events { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        .zip-item .zip-accounts { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

        /* Revenue Impact Gauge */
        .gauge-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 20px 0;
            flex-wrap: wrap;
        }
        .gauge {
            text-align: center;
        }
        .gauge svg {
            width: 140px;
            height: 80px;
        }
        .gauge .gauge-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .gauge .gauge-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Program breakdown table */
        .program-table {
            width: 100%;
            border-collapse: collapse;
        }
        .program-table th {
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .program-table td {
            padding: 10px 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .program-table tr:last-child td { border-bottom: none; }
        .program-table .money { font-weight: 600; }

        /* Footer */
        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.7rem;
            padding: 24px 0 12px;
        }
        .footer a { color: #64748b; text-decoration: none; }
        .footer a:hover { color: #94a3b8; }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #64748b;
            font-size: 0.9rem;
        }
        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #64748b;
            border-top-color: transparent;
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
            .back-link { display: inline-flex; align-items: center; gap: 6px; color: #60a5fa; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; transition: color 0.2s; }
        .back-link:hover { color: #93bbfc; }
    </style>
</head>
<body>
    <a href="hub.html" class="back-link">← Hub</a>
    <div class="header">
        <div>
            <h1>🛡️ Retention <span>Intelligence</span></h1>
            <div class="subtitle">Customer attrition analysis & win-back strategy — Mosquito Joe of Miami</div>
        </div>
        <div class="meta">
            <div id="lastUpdated">Loading...</div>
            <div id="dataPeriod"></div>
        </div>
    </div>

    <div id="alertBanner" class="alert-banner" style="display:none;"></div>

    <div class="kpi-grid" id="kpiGrid">
        <div class="loading">Loading retention data</div>
    </div>

    <div class="main-grid" id="mainContent">
        <!-- Populated by JS -->
    </div>

    <div class="footer">
        <a href="hub.html">← Back to Command Center</a> · Auto-refreshes every 5 minutes · Data from ServSuite cancel events
    </div>

    <script>
    (async function() {
        try {
            const res = await fetch('cancel-analysis.json?' + Date.now());
            if (!res.ok) throw new Error('Failed to load data');
            const data = await res.json();
            render(data);
        } catch(e) {
            document.getElementById('kpiGrid').innerHTML = `<div class="loading" style="color:#ef4444">Error loading data: ${e.message}</div>`;
        }
    })();

    function render(data) {
        const s = data.summary;
        const now = new Date(data.generated_at);

        // Header meta
        document.getElementById('lastUpdated').textContent = 'Updated: ' + now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        document.getElementById('dataPeriod').textContent = data.period;

        // Alert banner — only show if net customers is negative
        if (s.net_new_customers < 0) {
            const alertEl = document.getElementById('alertBanner');
            alertEl.style.display = 'flex';
            const gapToFiveM = Math.ceil(Math.abs(s.net_new_customers) + (5000000 - 526592) / s.avg_annual_value_per_account * 0.3);
            alertEl.innerHTML = `
                <div class="icon">⚠️</div>
                <div class="text">
                    <strong>Net customer count is negative.</strong> We're losing customers faster than we're gaining them.
                    The cancel-to-sales ratio is ${s.cancel_to_sales_ratio.toFixed(2)}x — for every sale, we're processing ${s.cancel_to_sales_ratio.toFixed(1)} cancel events.
                    To hit $5M, we need to flip this ratio below 1.0.
                </div>
                <div class="metric">
                    <div class="value">${s.net_new_customers}</div>
                    <div class="label">Net YTD</div>
                </div>
                <div class="metric">
                    <div class="value">${s.cancel_to_sales_ratio.toFixed(2)}x</div>
                    <div class="label">Cancel:Sale</div>
                </div>
            `;
        }

        // KPI Grid
        document.getElementById('kpiGrid').innerHTML = `
            <div class="kpi-card" style="--accent: #ef4444;">
                <div class="label">Annual Value Lost</div>
                <div class="value">$${(s.total_annual_value_lost/1000).toFixed(0)}K</div>
                <div class="detail">${s.total_cancel_events} cancel events · ${s.unique_accounts_cancelled} accounts</div>
            </div>
            <div class="kpi-card" style="--accent: #22c55e;">
                <div class="label">Recoverable Revenue</div>
                <div class="value">$${(s.recoverable_annual_value/1000).toFixed(0)}K</div>
                <div class="detail">${s.recoverable_accounts} accounts could be won back</div>
            </div>
            <div class="kpi-card" style="--accent: #f59e0b;">
                <div class="label">Controllable Losses</div>
                <div class="value">$${(s.controllable_value_lost/1000).toFixed(0)}K</div>
                <div class="detail">${s.controllable_events} events we could have prevented</div>
            </div>
            <div class="kpi-card" style="--accent: #3b82f6;">
                <div class="label">Avg Customer Lifetime</div>
                <div class="value">${(s.avg_customer_lifetime_days / 365).toFixed(1)}y</div>
                <div class="detail">Median: ${(s.median_customer_lifetime_days / 365).toFixed(1)} years · $${s.avg_annual_value_per_account.toFixed(0)}/yr avg</div>
            </div>
        `;

        // Main content
        const mainEl = document.getElementById('mainContent');
        mainEl.innerHTML = '';

        // 1. Monthly waterfall — sales vs cancels
        const monthlyCard = createCard('📊 Monthly: Sales vs Cancels', false);
        monthlyCard.innerHTML += buildWaterfall(data.by_month, s);
        mainEl.appendChild(monthlyCard);

        // 2. Cancel reasons with controllability
        const reasonsCard = createCard('🎯 Cancel Reasons by Revenue Impact', false);
        reasonsCard.innerHTML += buildReasonBars(data.by_reason, s.total_annual_value_lost);
        mainEl.appendChild(reasonsCard);

        // 3. Customer lifetime distribution
        const lifetimeCard = createCard('⏱️ Customer Lifetime at Cancellation', true);
        lifetimeCard.innerHTML += buildLifetimeChart(data.lifetime_distribution, s.total_cancel_events);
        mainEl.appendChild(lifetimeCard);

        // 4. Revenue impact gauge
        const gaugeCard = createCard('💰 Revenue Impact vs $5M Target', false);
        gaugeCard.innerHTML += buildRevenueImpact(s);
        mainEl.appendChild(gaugeCard);

        // 5. Win-back playbook
        const playbookCard = createCard('📋 Win-Back Playbook', false);
        playbookCard.innerHTML += buildPlaybook(data.by_reason, s);
        mainEl.appendChild(playbookCard);

        // 6. Program breakdown
        const programCard = createCard('📦 Attrition by Program', true);
        programCard.innerHTML += buildProgramTable(data.by_program);
        mainEl.appendChild(programCard);

        // 7. Zip code heatmap
        const zipCard = createCard('📍 Top Zip Codes — Cancel Concentration', true);
        zipCard.innerHTML += buildZipHeatmap(data.top_zip_codes);
        mainEl.appendChild(zipCard);
    }

    function createCard(title, full) {
        const div = document.createElement('div');
        div.className = 'card' + (full ? ' full' : '');
        div.innerHTML = `<h2>${title}</h2>`;
        return div;
    }

    function buildWaterfall(byMonth, summary) {
        if (!byMonth || !byMonth.length) return '<div class="loading">No monthly data</div>';

        const months = byMonth.map(m => ({
            label: new Date(m.month + '-01').toLocaleDateString('en-US', { month: 'short' }),
            sales: m.sales || Math.round(summary.total_sales_ytd / byMonth.length),
            cancels: m.unique_accounts || m.events,
            events: m.events
        }));

        const maxVal = Math.max(...months.flatMap(m => [m.sales || 30, m.cancels]));

        let html = '<div class="waterfall-chart">';
        months.forEach(m => {
            const salesH = Math.max(8, (m.sales / maxVal) * 160);
            const cancelH = Math.max(8, (m.cancels / maxVal) * 160);
            const net = m.sales - m.cancels;
            const netH = Math.max(8, (Math.abs(net) / maxVal) * 160);

            html += `
                <div class="wf-bar">
                    <div class="bar-value" style="color:#22c55e">+${m.sales}</div>
                    <div class="bar positive" style="height:${salesH}px"></div>
                    <div class="bar-label">${m.label}<br>Sales</div>
                </div>
                <div class="wf-bar">
                    <div class="bar-value" style="color:#ef4444">-${m.cancels}</div>
                    <div class="bar negative" style="height:${cancelH}px"></div>
                    <div class="bar-label">${m.label}<br>Cancels</div>
                </div>
                <div class="wf-bar">
                    <div class="bar-value" style="color:${net >= 0 ? '#22c55e' : '#3b82f6'}">${net >= 0 ? '+' : ''}${net}</div>
                    <div class="bar ${net >= 0 ? 'positive' : 'net'}" style="height:${netH}px"></div>
                    <div class="bar-label">${m.label}<br>Net</div>
                </div>
            `;
        });
        html += '</div>';

        return html;
    }

    function buildReasonBars(byReason, totalLost) {
        if (!byReason || !byReason.length) return '<div class="loading">No reason data</div>';

        // Sort by value lost descending
        const sorted = [...byReason].sort((a, b) => b.annual_value_lost - a.annual_value_lost);
        const maxVal = sorted[0].annual_value_lost;

        let html = '';
        sorted.forEach(r => {
            if (!r.reason) r.reason = 'Unknown/Blank';
            const pct = totalLost > 0 ? (r.annual_value_lost / totalLost * 100) : 0;
            const barWidth = maxVal > 0 ? (r.annual_value_lost / maxVal * 100) : 0;

            let barClass, tagClass, tagText;
            if (r.recoverable) {
                barClass = 'recoverable';
                tagClass = 'tag-recoverable';
                tagText = '♻️ WIN-BACK';
            } else if (['Unhappy w Service', 'Went w Competition', 'Bad Debt'].includes(r.reason)) {
                barClass = 'controllable';
                tagClass = 'tag-controllable';
                tagText = '⚡ PREVENTABLE';
            } else {
                barClass = 'uncontrollable';
                tagClass = 'tag-uncontrollable';
                tagText = '—';
            }

            html += `
                <div class="reason-row">
                    <div class="reason-bar-label" title="${r.reason}">${r.reason}</div>
                    <div class="reason-bar-container">
                        <div class="reason-bar-fill ${barClass}" style="width:${barWidth}%"></div>
                    </div>
                    <div class="reason-bar-value">$${(r.annual_value_lost/1000).toFixed(1)}K</div>
                    <span class="reason-bar-tag ${tagClass}">${tagText}</span>
                </div>
            `;
        });

        // Legend
        html += `
            <div style="display:flex;gap:20px;margin-top:16px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#94a3b8;">
                    <div style="width:12px;height:12px;border-radius:2px;background:linear-gradient(90deg,#22c55e,#4ade80);"></div> Recoverable (win-back opportunity)
                </div>
                <div style="display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#94a3b8;">
                    <div style="width:12px;height:12px;border-radius:2px;background:linear-gradient(90deg,#ef4444,#f97316);"></div> Preventable (service/ops issue)
                </div>
                <div style="display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#94a3b8;">
                    <div style="width:12px;height:12px;border-radius:2px;background:linear-gradient(90deg,#64748b,#94a3b8);"></div> External (moved, etc.)
                </div>
            </div>
        `;

        return html;
    }

    function buildLifetimeChart(distribution, totalEvents) {
        if (!distribution || !distribution.length) return '<div class="loading">No lifetime data</div>';

        const colors = ['#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e', '#14b8a6', '#3b82f6'];
        let html = '<div class="lifetime-grid">';
        distribution.forEach((d, i) => {
            const pct = totalEvents > 0 ? (d.count / totalEvents * 100).toFixed(1) : 0;
            html += `
                <div class="lifetime-item">
                    <div class="count" style="color:${colors[i % colors.length]}">${d.count}</div>
                    <div class="bucket">${d.bucket}</div>
                    <div class="pct">${pct}%</div>
                </div>
            `;
        });
        html += '</div>';

        // Insight callout
        const earlyChurn = distribution.filter(d => ['0-30 days', '31-90 days', '91-180 days'].includes(d.bucket)).reduce((sum, d) => sum + d.count, 0);
        const loyalChurn = distribution.filter(d => ['3-5 years', '5+ years'].includes(d.bucket)).reduce((sum, d) => sum + d.count, 0);
        const earlyPct = (earlyChurn / totalEvents * 100).toFixed(0);
        const loyalPct = (loyalChurn / totalEvents * 100).toFixed(0);

        html += `
            <div style="display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;">
                <div style="flex:1;min-width:200px;padding:12px 16px;background:rgba(239,68,68,0.1);border-radius:8px;border-left:3px solid #ef4444;">
                    <div style="font-size:0.75rem;font-weight:600;color:#ef4444;">⚡ Early Churn (< 6 months)</div>
                    <div style="font-size:0.8rem;color:#94a3b8;margin-top:4px;">${earlyChurn} customers (${earlyPct}%) — indicates onboarding or expectation gaps</div>
                </div>
                <div style="flex:1;min-width:200px;padding:12px 16px;background:rgba(59,130,246,0.1);border-radius:8px;border-left:3px solid #3b82f6;">
                    <div style="font-size:0.75rem;font-weight:600;color:#3b82f6;">📊 Long-term Attrition (3+ years)</div>
                    <div style="font-size:0.8rem;color:#94a3b8;margin-top:4px;">${loyalChurn} customers (${loyalPct}%) — natural lifecycle, harder to prevent but highest LTV lost</div>
                </div>
            </div>
        `;

        return html;
    }

    function buildRevenueImpact(s) {
        const targetRevenue = 5000000;
        const currentRevenue = 526592; // from health check
        const lostAnnualValue = s.total_annual_value_lost;
        const recoverableValue = s.recoverable_annual_value;
        const controlableValue = s.controllable_value_lost;

        // If we recovered all recoverable + prevented all controllable
        const maxRecovery = recoverableValue + controlableValue;
        const recoveryPctOfTarget = (maxRecovery / targetRevenue * 100).toFixed(1);

        let html = `
            <div class="gauge-container">
                <div style="text-align:center;">
                    <div style="font-size:2.2rem;font-weight:800;color:#ef4444;">$${(lostAnnualValue/1000).toFixed(0)}K</div>
                    <div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Total Annual Value Lost</div>
                    <div style="font-size:0.7rem;color:#475569;margin-top:4px;">That's ${(lostAnnualValue/targetRevenue*100).toFixed(1)}% of the $5M target</div>
                </div>
                <div style="width:1px;height:60px;background:rgba(255,255,255,0.08);"></div>
                <div style="text-align:center;">
                    <div style="font-size:2.2rem;font-weight:800;color:#22c55e;">$${(maxRecovery/1000).toFixed(0)}K</div>
                    <div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Addressable Recovery</div>
                    <div style="font-size:0.7rem;color:#475569;margin-top:4px;">Recoverable ($${(recoverableValue/1000).toFixed(0)}K) + Preventable ($${(controlableValue/1000).toFixed(0)}K)</div>
                </div>
                <div style="width:1px;height:60px;background:rgba(255,255,255,0.08);"></div>
                <div style="text-align:center;">
                    <div style="font-size:2.2rem;font-weight:800;color:#f59e0b;">${recoveryPctOfTarget}%</div>
                    <div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Of $5M Target</div>
                    <div style="font-size:0.7rem;color:#475569;margin-top:4px;">Retention = growth lever #1</div>
                </div>
            </div>

            <div style="margin-top:16px;padding:16px;background:rgba(34,197,94,0.08);border-radius:8px;border:1px solid rgba(34,197,94,0.2);">
                <div style="font-size:0.8rem;font-weight:600;color:#22c55e;margin-bottom:6px;">💡 The Math</div>
                <div style="font-size:0.8rem;color:#94a3b8;line-height:1.6;">
                    If we win back <strong style="color:#22c55e">50%</strong> of recoverable accounts ($${(recoverableValue * 0.5 / 1000).toFixed(0)}K) and prevent
                    <strong style="color:#f59e0b">30%</strong> of controllable losses ($${(controlableValue * 0.3 / 1000).toFixed(0)}K),
                    that's <strong style="color:#e2e8f0">$${((recoverableValue * 0.5 + controlableValue * 0.3) / 1000).toFixed(0)}K</strong> in recovered annual revenue.
                    At an avg value of $${s.avg_annual_value_per_account.toFixed(0)}/yr, that's equivalent to winning
                    <strong style="color:#e2e8f0">${Math.round((recoverableValue * 0.5 + controlableValue * 0.3) / s.avg_annual_value_per_account)} new customers</strong> — without the acquisition cost.
                </div>
            </div>
        `;

        return html;
    }

    function buildPlaybook(byReason, s) {
        // Generate targeted playbook entries based on actual data
        const plays = [];

        // Find recoverable reasons
        const recoverable = byReason.filter(r => r.recoverable).sort((a, b) => b.annual_value_lost - a.annual_value_lost);
        const financialReason = recoverable.find(r => r.reason === 'Financial Reasons');
        const notInterested = recoverable.find(r => r.reason === 'Not Interested at this time');
        const otherReview = recoverable.find(r => r.reason === 'Other - Review Note');
        const oneSpray = recoverable.find(r => r.reason && r.reason.includes('one spray'));

        if (financialReason) {
            plays.push({
                title: `Win-Back: Financial Reasons (${financialReason.unique_accounts} accounts, $${(financialReason.annual_value_lost/1000).toFixed(0)}K)`,
                desc: 'Offer a reduced-frequency plan or seasonal-only pricing. These customers WANT the service — they just can\'t afford the full program. A 30% discount beats a 100% cancel.',
                impact: 'HIGH',
                impactColor: '#22c55e',
                color: '#22c55e'
            });
        }

        if (notInterested) {
            plays.push({
                title: `Win-Back: "Not Interested" (${notInterested.unique_accounts} accounts, $${(notInterested.annual_value_lost/1000).toFixed(0)}K)`,
                desc: 'These customers need re-engagement before cancel. Trigger a "before you go" call when cancel is requested — offer one free treatment to remind them of the value. Follow up 30/60/90 days post-cancel.',
                impact: 'HIGH',
                impactColor: '#22c55e',
                color: '#22c55e'
            });
        }

        const unhappy = byReason.find(r => r.reason === 'Unhappy w Service');
        if (unhappy) {
            plays.push({
                title: `Prevent: Service Quality Issues (${unhappy.unique_accounts} accounts, $${(unhappy.annual_value_lost/1000).toFixed(0)}K)`,
                desc: 'Implement post-service NPS survey via GHL automation. Flag any score < 7 for immediate CSR follow-up. Catch complaints within 24h before they become cancels.',
                impact: 'MEDIUM',
                impactColor: '#f59e0b',
                color: '#f59e0b'
            });
        }

        const competition = byReason.find(r => r.reason === 'Went w Competition');
        if (competition) {
            plays.push({
                title: `Prevent: Lost to Competition (${competition.unique_accounts} accounts, $${(competition.annual_value_lost/1000).toFixed(0)}K)`,
                desc: 'Price match or beat within 10% for customers with 2+ years of tenure. Long-term customers are worth keeping. Also: discover who the competitor is and document their pricing.',
                impact: 'MEDIUM',
                impactColor: '#f59e0b',
                color: '#ef4444'
            });
        }

        if (oneSpray) {
            plays.push({
                title: `Convert: One-Time Sprays → Recurring (${oneSpray.unique_accounts} accounts)`,
                desc: 'Customers who "only wanted one spray" are unconverted leads. After service, CSR follow-up with: "How did the treatment work? We recommend ongoing protection for best results." Offer a seasonal starter pack.',
                impact: 'LOW',
                impactColor: '#3b82f6',
                color: '#3b82f6'
            });
        }

        const badDebt = byReason.find(r => r.reason === 'Bad Debt');
        if (badDebt) {
            plays.push({
                title: `Prevent: Bad Debt (${badDebt.unique_accounts} accounts, $${(badDebt.annual_value_lost/1000).toFixed(0)}K)`,
                desc: 'This is the #2 value loss category. Implement autopay requirement for new customers, and earlier collection triggers (flag at 30 days, not 60). Consider requiring credit card on file.',
                impact: 'HIGH',
                impactColor: '#22c55e',
                color: '#ef4444'
            });
        }

        let html = '';
        plays.forEach(p => {
            html += `
                <div class="playbook-item" style="--color:${p.color}">
                    <h3>${p.title}</h3>
                    <div class="desc">${p.desc}</div>
                    <div class="impact" style="background:${p.impactColor}22;color:${p.impactColor};">Impact: ${p.impact}</div>
                </div>
            `;
        });

        return html;
    }

    function buildProgramTable(byProgram) {
        if (!byProgram || !byProgram.length) return '<div class="loading">No program data</div>';

        const sorted = [...byProgram].sort((a, b) => b.annual_value_lost - a.annual_value_lost);

        let html = `
            <table class="program-table">
                <thead>
                    <tr>
                        <th>Program</th>
                        <th>Events</th>
                        <th>Accounts</th>
                        <th>Annual Value Lost</th>
                        <th>Avg Value</th>
                    </tr>
                </thead>
                <tbody>
        `;

        sorted.forEach(p => {
            const avgValue = p.unique_accounts > 0 ? (p.annual_value_lost / p.unique_accounts) : 0;
            html += `
                <tr>
                    <td>${p.program}</td>
                    <td>${p.events}</td>
                    <td>${p.unique_accounts}</td>
                    <td class="money" style="color:#ef4444;">$${p.annual_value_lost.toLocaleString()}</td>
                    <td class="money">$${avgValue.toFixed(0)}</td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        return html;
    }

    function buildZipHeatmap(zipCodes) {
        if (!zipCodes || !zipCodes.length) return '<div class="loading">No zip data</div>';

        const maxEvents = zipCodes[0].events;

        let html = '<div class="zip-grid">';
        zipCodes.forEach(z => {
            const intensity = z.events / maxEvents;
            const r = Math.round(239 * intensity + 100 * (1 - intensity));
            const g = Math.round(68 * intensity + 116 * (1 - intensity));
            const b = Math.round(68 * intensity + 139 * (1 - intensity));
            const bgColor = `rgba(${r}, ${g}, ${b}, 0.2)`;
            const borderColor = `rgba(${r}, ${g}, ${b}, 0.4)`;

            html += `
                <div class="zip-item" style="background:${bgColor};border:1px solid ${borderColor};">
                    <div class="zip">${z.zip}</div>
                    <div class="zip-events">${z.events} events</div>
                    <div class="zip-accounts">${z.unique_accounts} accounts</div>
                </div>
            `;
        });
        html += '</div>';

        // Insight
        const topZip = zipCodes[0];
        html += `
            <div style="margin-top:12px;font-size:0.75rem;color:#64748b;">
                💡 Highest concentration: ${topZip.zip} with ${topZip.events} cancel events from ${topZip.unique_accounts} accounts.
                Consider geo-targeted win-back campaigns in these zip codes.
            </div>
        `;

        return html;
    }
