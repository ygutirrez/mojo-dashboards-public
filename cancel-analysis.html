<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <title>MoJo Cancel Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #ff4444, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .meta {
            color: #888;
            font-size: 0.85rem;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: inline-block;
        }
        .back-link:hover { color: #999; }

        /* KPI Cards */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .kpi-card.alert {
            border-color: rgba(255,68,68,0.3);
            background: rgba(255,68,68,0.05);
        }

        .kpi-card.warning {
            border-color: rgba(255,170,0,0.3);
            background: rgba(255,170,0,0.05);
        }

        .kpi-card.success {
            border-color: rgba(0,200,83,0.3);
            background: rgba(0,200,83,0.05);
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .kpi-card.alert .kpi-value { color: #ff4444; }
        .kpi-card.warning .kpi-value { color: #ffaa00; }
        .kpi-card.success .kpi-value { color: #00c853; }

        .kpi-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-sub {
            color: #666;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* Sections */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            body { padding: 12px; }
            h1 { font-size: 1.4rem !important; }
            .panel { padding: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            table { min-width: 350px; font-size: 0.8rem; }
            th, td { padding: 8px 6px; }
        }

        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
        }

        .panel h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: #ccc;
        }

        .panel h3 .icon { margin-right: 8px; }

        /* Horizontal Bar Chart */
        .bar-chart { display: flex; flex-direction: column; gap: 10px; }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar-label {
            min-width: 160px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: right;
        }

        .bar-track {
            flex: 1;
            height: 24px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            min-width: fit-content;
        }

        .bar-value {
            min-width: 80px;
            font-size: 0.8rem;
            color: #888;
        }

        /* Donut Chart (CSS) */
        .donut-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .donut {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .donut-center {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .donut-center .pct {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff8800;
        }

        .donut-center .lbl {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* Lifetime Distribution */
        .lifetime-bars {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 140px;
            padding-top: 10px;
        }

        .lifetime-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .lifetime-bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease;
            min-height: 2px;
        }

        .lifetime-label {
            font-size: 0.6rem;
            color: #666;
            margin-top: 6px;
            text-align: center;
            line-height: 1.2;
        }

        .lifetime-count {
            font-size: 0.7rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        /* Monthly Trend */
        .trend-chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
        }

        .trend-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .trend-bar {
            width: 100%;
            max-width: 50px;
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease;
            position: relative;
        }

        .trend-value {
            font-size: 0.7rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        .trend-label {
            font-size: 0.7rem;
            color: #666;
            margin-top: 6px;
        }

        /* Recovery Opportunity */
        .opportunity-card {
            background: linear-gradient(135deg, rgba(0,200,83,0.08), rgba(0,200,83,0.02));
            border: 1px solid rgba(0,200,83,0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .opportunity-card h3 {
            color: #00c853;
            margin-bottom: 12px;
        }

        .opportunity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .opp-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .opp-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .opp-text h4 {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        .opp-text p {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }

        .opp-text .value {
            color: #00c853;
            font-weight: 600;
        }

        /* Table */
        .zip-table {
            width: 100%;
            border-collapse: collapse;
        }

        .zip-table th, .zip-table td {
            padding: 8px 12px;
            text-align: left;
            font-size: 0.85rem;
        }

        .zip-table th {
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 500;
        }

        .zip-table td {
            color: #ccc;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .zip-table tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        /* Net Growth Indicator */
        .net-growth {
            display: flex;
            align-items: center;
            gap: 24px;
            justify-content: center;
            padding: 16px;
        }

        .net-arrow {
            font-size: 2rem;
        }

        .net-block {
            text-align: center;
        }

        .net-block .num {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .net-block .lbl {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .source-banner {
            margin-bottom: 18px;
            padding: 14px 16px;
            border: 1px solid rgba(255,170,0,0.3);
            border-radius: 10px;
            background: rgba(255,170,0,0.06);
            color: #bbb;
            font-size: 0.82rem;
            line-height: 1.5;
        }
        .source-banner strong { color: #ffaa00; }
        .table-wrap { overflow-x: auto; }
        .recent-table { width: 100%; border-collapse: collapse; }
        .recent-table th, .recent-table td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.8rem; text-align: left; }
        .recent-table th { color: #888; font-weight: 500; }
        .recent-table td { color: #ccc; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Hub</a>

    <div class="header">
        <h1>📉 Cancellation Analysis</h1>
        <div class="meta">
            <span id="period">Loading...</span><br>
            <span id="updated">—</span>
        </div>
    </div>

    <div id="dashboard">
        <div class="loading">Loading cancellation data...</div>
    </div>

    <script>
    const DATA_URL = 'cancel-analysis.json';

    async function loadData() {
        try {
            const res = await fetch(DATA_URL + '?t=' + Date.now());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } catch(e) {
            document.getElementById('dashboard').innerHTML =
                '<div class="loading">❌ Failed to load data: ' + e.message + '</div>';
            return null;
        }
    }

    function fmt$(n) {
        return '$' + Math.round(n).toLocaleString();
    }

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render(data) {
        const s = data.summary;
        const el = document.getElementById('dashboard');

        const reasonCapturePct = s.reason_capture_pct || 0;
        const donutGrad = `conic-gradient(#00c853 0% ${reasonCapturePct}%, #ff4444 ${reasonCapturePct}% 100%)`;

        // Reason bars
        const maxEvents = Math.max(1, ...data.by_reason.map(r => r.events));
        const reasonBars = data.by_reason.map(r => {
            const pct = (r.events / maxEvents * 100).toFixed(0);
            const color = r.recoverable ? '#00c853' :
                          r.reason === 'Moved' ? '#666' :
                          r.reason === 'Bad Debt' ? '#ff4444' :
                          r.reason === 'Went w Competition' ? '#ff8800' :
                          r.reason === 'Unhappy w Service' ? '#ff6666' :
                          '#888';
            return `
                <div class="bar-row">
                    <div class="bar-label">${esc(r.reason)}</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:${pct}%; background:${color}">
                            ${r.events}
                        </div>
                    </div>
                    <div class="bar-value">${fmt$(r.annual_value_lost)}/yr</div>
                </div>`;
        }).join('');

        // Lifetime bars
        const maxLifetime = Math.max(...data.lifetime_distribution.map(b => b.count));
        const lifetimeBars = data.lifetime_distribution.map(b => {
            const pct = maxLifetime > 0 ? (b.count / maxLifetime * 100) : 0;
            const colors = ['#ff4444', '#ff6644', '#ff8844', '#ffaa44', '#cccc44', '#88cc44', '#44cc44', '#00c853'];
            const idx = data.lifetime_distribution.indexOf(b);
            return `
                <div class="lifetime-bar-col">
                    <div class="lifetime-count">${b.count}</div>
                    <div class="lifetime-bar" style="height:${pct}%; background:${colors[idx] || '#888'}"></div>
                    <div class="lifetime-label">${b.bucket.replace(' days','d').replace(' years','y').replace(' year','y')}</div>
                </div>`;
        }).join('');

        // Monthly trend
        const maxMonth = Math.max(...data.by_month.map(m => m.events));
        const trendBars = data.by_month.map(m => {
            const pct = maxMonth > 0 ? (m.events / maxMonth * 100) : 0;
            const monthLabel = m.month.split('-')[1];
            const monthNames = {
                '01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun',
                '07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'
            };
            return `
                <div class="trend-col">
                    <div class="trend-value">${m.events}</div>
                    <div class="trend-bar" style="height:${pct}%; background: linear-gradient(180deg, #ff4444, #ff8800)"></div>
                    <div class="trend-label">${monthNames[monthLabel] || monthLabel}</div>
                </div>`;
        }).join('');

        // Net growth indicator
        const isNegative = s.net_new_customers < 0;
        const netColor = isNegative ? '#ff4444' : '#00c853';
        const netSign = isNegative ? '' : '+';

        // Zip table rows
        const zipRows = data.top_zip_codes.slice(0, 10).map(z => `
            <tr>
                <td>${z.zip}</td>
                <td>${z.unique_accounts}</td>
                <td>${z.events}</td>
            </tr>
        `).join('');

        const serviceRows = data.by_program.slice(0, 8).map(r => `<tr><td>${esc(r.program)}</td><td>${r.unique_accounts}</td><td>${fmt$(r.annual_value_lost)}</td></tr>`).join('');
        const sales = data.sales_context || {};
        const salesCategoryRows = (sales.by_category || []).slice(0, 8).map(r => `<tr><td>${esc(r.category)}</td><td>${r.sales}</td></tr>`).join('');
        const csrRows = (data.by_csr || []).filter(r => r.csr !== 'Not recorded').map(r => `<tr><td>${esc(r.csr)}</td><td>${r.accounts}</td><td>${fmt$(r.annual_value_lost)}</td></tr>`).join('');
        const recentRows = (data.recent_losses || []).slice(0, 12).map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.zip)}</td><td>${esc(r.service)}</td><td>${r.tenure_days == null ? '—' : (r.tenure_days / 365).toFixed(1) + 'y'}</td><td>${fmt$(r.trailing_12m_revenue)}</td><td>${esc(r.reason)}</td><td>${esc(r.csr)}</td></tr>`).join('');

        el.innerHTML = `
            <div class="source-banner"><strong>Primary source: ServiceMinder · Cross-check: Office Tally</strong> · ServiceMinder determines whether an account is actually lost and supplies invoice revenue. Office Tally supplies the cancellation date, reason, and recording CSR only when one unique customer name matches within 30 days. Unmatched records remain explicitly labeled <em>Not recorded</em>.</div>
            <!-- KPI Row 1: The Headline Numbers -->
            <div class="kpi-row">
                <div class="kpi-card alert">
                    <div class="kpi-value">${fmt$(s.total_annual_value_lost)}</div>
                    <div class="kpi-label">Trailing 12-Month Revenue Lost</div>
                    <div class="kpi-sub">Revenue previously produced by lost accounts</div>
                </div>
                <div class="kpi-card alert">
                    <div class="kpi-value">${s.unique_accounts_cancelled}</div>
                    <div class="kpi-label">Recorded Customer Losses</div>
                    <div class="kpi-sub">${s.recorded_attrition_pct}% of active + lost base since cutover</div>
                </div>
                <div class="kpi-card warning">
                    <div class="kpi-value">${s.recent_30d_accounts}</div>
                    <div class="kpi-label">Lost in Last 30 Days</div>
                    <div class="kpi-sub">${fmt$(s.recent_30d_revenue)} trailing revenue</div>
                </div>
                <div class="kpi-card ${reasonCapturePct < 90 ? 'alert' : 'success'}">
                    <div class="kpi-value">${reasonCapturePct.toFixed(1)}%</div>
                    <div class="kpi-label">Cancel Reason Capture</div>
                    <div class="kpi-sub">${s.reason_known_accounts} of ${s.unique_accounts_cancelled} lost accounts</div>
                </div>
            </div>

            <!-- Office Tally sales context -->
            <div class="panel" style="margin-bottom:20px">
                <h3><span class="icon">📈</span>Last 30 Days: Sales Activity vs Confirmed Customer Losses</h3>
                <div class="net-growth">
                    <div class="net-block">
                        <div class="num" style="color:#00c853">${sales.sales_logged_30d ?? '—'}</div>
                        <div class="lbl">Office Tally Sales Logged</div>
                    </div>
                    <div class="net-arrow">vs</div>
                    <div class="net-block">
                        <div class="num" style="color:#ff4444">${s.recent_30d_accounts}</div>
                        <div class="lbl">ServiceMinder Confirmed Losses</div>
                    </div>
                    <div class="net-arrow">=</div>
                    <div class="net-block">
                        <div class="num" style="color:${(sales.gross_activity_gap_30d || 0) > 0 ? '#ffaa00' : '#ff4444'}">${(sales.gross_activity_gap_30d || 0) > 0 ? '+' : ''}${sales.gross_activity_gap_30d ?? '—'}</div>
                        <div class="lbl">Gross Activity Gap</div>
                    </div>
                    <div class="net-block">
                        <div class="num" style="color:#66aaff">${sales.restarts_30d ?? '—'}</div>
                        <div class="lbl">Restarts / Winbacks</div>
                    </div>
                </div>
                <div class="opp-text" style="text-align:center"><p>Sales logged are broader than net-new recurring customers: the tally includes restarts, one-time work, and add-on programs. Use this comparison as activity context, not accounting net growth.</p></div>
            </div>

            <!-- Immediate retention queue -->
            <div class="opportunity-card">
                <h3>☎️ Immediate retention review: ${s.recent_30d_accounts} customers and ${fmt$(s.recent_30d_revenue)} of trailing revenue lost in the last 30 days</h3>
                <div class="opportunity-grid">
                    <div class="opp-item"><div class="opp-icon">⚠️</div><div class="opp-text"><h4>Close the remaining reason gap</h4><p>${s.unknown_events} ServiceMinder customer losses could not be confidently matched to a reason in the Office Tally. Require the same customer identifier in both systems and a reason whenever an account is closed.</p></div></div>
                    <div class="opp-item"><div class="opp-icon">📞</div><div class="opp-text"><h4>Work the recent-loss queue</h4><p>Prioritize former customers with recent service and the highest trailing revenue. The anonymized queue appears below; use ServiceMinder for customer-level follow-up.</p></div></div>
                </div>
            </div>

            <!-- Reason Breakdown + Controllable Split -->
            <div class="grid-2">
                <div class="panel">
                    <h3><span class="icon">📊</span>Account-Level Cancel Reasons</h3>
                    <div class="bar-chart">
                        ${reasonBars}
                    </div>
                </div>
                <div>
                    <div class="panel" style="margin-bottom:20px">
                        <h3><span class="icon">🧾</span>Reason Data Completeness</h3>
                        <div class="donut-container">
                            <div class="donut" style="background:${donutGrad}">
                                <div class="donut-center">
                                    <div class="pct">${reasonCapturePct.toFixed(1)}%</div>
                                    <div class="lbl">Captured</div>
                                </div>
                            </div>
                            <div class="legend">
                                <div class="legend-item">
                                    <div class="legend-dot" style="background:#00c853"></div>
                                    Reason captured (${s.reason_known_accounts})
                                </div>
                                <div class="legend-item">
                                    <div class="legend-dot" style="background:#ff4444"></div>
                                    Missing account reason (${s.unknown_events})
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Customer Lifetime at Cancel -->
                    <div class="panel">
                        <h3><span class="icon">⏱️</span>Customer Lifetime at Cancellation</h3>
                        <div style="text-align:center; margin-bottom:12px">
                            <span style="color:#ffaa00; font-size:1.2rem; font-weight:600">
                                Avg: ${(s.avg_customer_lifetime_days / 365).toFixed(1)} years
                            </span>
                            <span style="color:#888; margin-left:12px">
                                Median: ${(s.median_customer_lifetime_days / 365).toFixed(1)} years
                            </span>
                        </div>
                        <div class="lifetime-bars">
                            ${lifetimeBars}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Monthly Trend + Zip Codes -->
            <div class="grid-2">
                <div class="panel">
                    <h3><span class="icon">📅</span>Cancels by Month</h3>
                    <div class="trend-chart">
                        ${trendBars}
                    </div>
                </div>
                <div class="panel">
                    <h3><span class="icon">🦟</span>Last Billed Service Before Loss</h3>
                    <table class="zip-table">
                        <thead><tr><th>Service</th><th>Accounts</th><th>Trailing Revenue</th></tr></thead>
                        <tbody>${serviceRows}</tbody>
                    </table>
                </div>
            </div>

            <div class="grid-2">
                <div class="panel">
                    <h3><span class="icon">🎯</span>Office Tally Sales Mix — YTD</h3>
                    <table class="zip-table"><thead><tr><th>Sale Type</th><th>Logged Sales</th></tr></thead><tbody>${salesCategoryRows}</tbody></table>
                </div>
                <div class="panel">
                    <h3><span class="icon">📌</span>Coverage & Definitions</h3>
                    <div class="opp-text"><p><strong>Active customer base:</strong> ${s.active_customer_base.toLocaleString()}</p><p><strong>90-day losses:</strong> ${s.recent_90d_accounts}</p><p><strong>Office sales logged YTD:</strong> ${(sales.sales_logged_ytd || 0).toLocaleString()} (${sales.restarts_ytd || 0} restarts)</p><p><strong>Customer loss definition:</strong> ${esc(data.source.definition)}</p><p><strong>Loss date:</strong> ${esc(data.source.loss_date)}</p><p><strong>Reason matching:</strong> ${esc(data.source.reason_capture)}</p><p><strong>Sales context:</strong> ${esc(sales.definition || '')}</p><p><strong>Value metric:</strong> ${esc(data.source.value_metric)}</p></div>
                </div>
            </div>

            <div class="grid-2">
                <div class="panel">
                    <h3><span class="icon">📍</span>Top Loss Zip Codes</h3>
                    <table class="zip-table"><thead><tr><th>Zip Code</th><th>Accounts</th><th>Loss Records</th></tr></thead><tbody>${zipRows}</tbody></table>
                </div>
                <div class="panel">
                    <h3><span class="icon">📝</span>Cancellation Records Entered by CSR</h3>
                    <div class="opp-text" style="margin-bottom:10px"><p>This shows who recorded or handled the matched cancellation entry. It does not attribute responsibility for the customer loss.</p></div>
                    <table class="zip-table"><thead><tr><th>Recorded by</th><th>Matched Accounts</th><th>Trailing Revenue</th></tr></thead><tbody>${csrRows}</tbody></table>
                </div>
            </div>

            <div class="panel" style="margin-bottom:20px">
                <h3><span class="icon">🔎</span>Recent Losses — Anonymized Operating View</h3>
                <div class="table-wrap"><table class="recent-table"><thead><tr><th>Date</th><th>Zip</th><th>Last Service</th><th>Tenure</th><th>Trailing Revenue</th><th>Reason</th><th>Recorded by</th></tr></thead><tbody>${recentRows}</tbody></table></div>
            </div>

            <!-- Average Value Card -->
            <div class="kpi-row" style="margin-top:20px">
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${fmt$(s.avg_annual_value_per_account)}</div>
                    <div class="kpi-label">Avg Trailing Revenue / Lost Account</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${s.active_customer_base.toLocaleString()}</div>
                    <div class="kpi-label">Current Active Customer Base</div>
                    <div class="kpi-sub">ServiceMinder active categories</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${s.cancel_to_sales_ratio.toFixed(2)}x</div>
                    <div class="kpi-label">Loss-to-New-Active Ratio</div>
                    <div class="kpi-sub">Same ServiceMinder cutover period</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${data.by_program[0]?.program || 'N/A'}</div>
                    <div class="kpi-label">Largest Lost Service Segment</div>
                    <div class="kpi-sub">${data.by_program[0]?.unique_accounts || 0} accounts · ${fmt$(data.by_program[0]?.annual_value_lost || 0)}</div>
                </div>
            </div>
        `;

        // Update header
        document.getElementById('period').textContent = data.period || 'YTD 2026';
        const ts = data.generated_at ? new Date(data.generated_at) : null;
        document.getElementById('updated').textContent = ts
            ? 'Updated: ' + ts.toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})
            : '';
    }

    loadData().then(data => {
        if (data) render(data);
    });
    </script>
    <script src="navigator.js"></script>
</body>
</html>
