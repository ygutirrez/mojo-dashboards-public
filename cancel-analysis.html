<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <title>MoJo Cancel Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #ff4444, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .meta {
            color: #888;
            font-size: 0.85rem;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: inline-block;
        }
        .back-link:hover { color: #999; }

        /* KPI Cards */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .kpi-card.alert {
            border-color: rgba(255,68,68,0.3);
            background: rgba(255,68,68,0.05);
        }

        .kpi-card.warning {
            border-color: rgba(255,170,0,0.3);
            background: rgba(255,170,0,0.05);
        }

        .kpi-card.success {
            border-color: rgba(0,200,83,0.3);
            background: rgba(0,200,83,0.05);
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .kpi-card.alert .kpi-value { color: #ff4444; }
        .kpi-card.warning .kpi-value { color: #ffaa00; }
        .kpi-card.success .kpi-value { color: #00c853; }

        .kpi-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-sub {
            color: #666;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* Sections */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            body { padding: 12px; }
            h1 { font-size: 1.4rem !important; }
            .panel { padding: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            table { min-width: 350px; font-size: 0.8rem; }
            th, td { padding: 8px 6px; }
        }

        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
        }

        .panel h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: #ccc;
        }

        .panel h3 .icon { margin-right: 8px; }

        /* Horizontal Bar Chart */
        .bar-chart { display: flex; flex-direction: column; gap: 10px; }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar-label {
            min-width: 160px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: right;
        }

        .bar-track {
            flex: 1;
            height: 24px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            min-width: fit-content;
        }

        .bar-value {
            min-width: 80px;
            font-size: 0.8rem;
            color: #888;
        }

        /* Donut Chart (CSS) */
        .donut-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .donut {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .donut-center {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .donut-center .pct {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff8800;
        }

        .donut-center .lbl {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* Lifetime Distribution */
        .lifetime-bars {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 140px;
            padding-top: 10px;
        }

        .lifetime-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .lifetime-bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease;
            min-height: 2px;
        }

        .lifetime-label {
            font-size: 0.6rem;
            color: #666;
            margin-top: 6px;
            text-align: center;
            line-height: 1.2;
        }

        .lifetime-count {
            font-size: 0.7rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        /* Monthly Trend */
        .trend-chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
        }

        .trend-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .trend-bar {
            width: 100%;
            max-width: 50px;
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease;
            position: relative;
        }

        .trend-value {
            font-size: 0.7rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        .trend-label {
            font-size: 0.7rem;
            color: #666;
            margin-top: 6px;
        }

        /* Recovery Opportunity */
        .opportunity-card {
            background: linear-gradient(135deg, rgba(0,200,83,0.08), rgba(0,200,83,0.02));
            border: 1px solid rgba(0,200,83,0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .opportunity-card h3 {
            color: #00c853;
            margin-bottom: 12px;
        }

        .opportunity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .opp-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .opp-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .opp-text h4 {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        .opp-text p {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }

        .opp-text .value {
            color: #00c853;
            font-weight: 600;
        }

        /* Table */
        .zip-table {
            width: 100%;
            border-collapse: collapse;
        }

        .zip-table th, .zip-table td {
            padding: 8px 12px;
            text-align: left;
            font-size: 0.85rem;
        }

        .zip-table th {
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 500;
        }

        .zip-table td {
            color: #ccc;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .zip-table tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        /* Net Growth Indicator */
        .net-growth {
            display: flex;
            align-items: center;
            gap: 24px;
            justify-content: center;
            padding: 16px;
        }

        .net-arrow {
            font-size: 2rem;
        }

        .net-block {
            text-align: center;
        }

        .net-block .num {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .net-block .lbl {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Hub</a>

    <div class="header">
        <h1>📉 Cancellation Analysis</h1>
        <div class="meta">
            <span id="period">Loading...</span><br>
            <span id="updated">—</span>
        </div>
    </div>

    <div id="dashboard">
        <div class="loading">Loading cancellation data...</div>
    </div>

    <script>
    const DATA_URL = 'cancel-analysis.json';

    async function loadData() {
        try {
            const res = await fetch(DATA_URL + '?t=' + Date.now());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } catch(e) {
            document.getElementById('dashboard').innerHTML =
                '<div class="loading">❌ Failed to load data: ' + e.message + '</div>';
            return null;
        }
    }

    function fmt$(n) {
        return '$' + Math.round(n).toLocaleString();
    }

    function render(data) {
        const s = data.summary;
        const el = document.getElementById('dashboard');

        // Controllable percentage
        const totalClassified = s.controllable_events + s.uncontrollable_events + s.structural_events;
        const controllablePct = totalClassified > 0 ? Math.round((s.controllable_events / totalClassified) * 100) : 0;
        const uncontrollablePct = totalClassified > 0 ? Math.round((s.uncontrollable_events / totalClassified) * 100) : 0;
        const structuralPct = 100 - controllablePct - uncontrollablePct;

        // Donut gradient
        const c1 = controllablePct;
        const c2 = c1 + uncontrollablePct;
        const donutGrad = `conic-gradient(#ff8800 0% ${c1}%, #666 ${c1}% ${c2}%, #444 ${c2}% 100%)`;

        // Reason bars
        const maxEvents = Math.max(...data.by_reason.map(r => r.events));
        const reasonBars = data.by_reason.map(r => {
            const pct = (r.events / maxEvents * 100).toFixed(0);
            const color = r.recoverable ? '#00c853' :
                          r.reason === 'Moved' ? '#666' :
                          r.reason === 'Bad Debt' ? '#ff4444' :
                          r.reason === 'Went w Competition' ? '#ff8800' :
                          r.reason === 'Unhappy w Service' ? '#ff6666' :
                          '#888';
            return `
                <div class="bar-row">
                    <div class="bar-label">${r.reason}</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:${pct}%; background:${color}">
                            ${r.events}
                        </div>
                    </div>
                    <div class="bar-value">${fmt$(r.annual_value_lost)}/yr</div>
                </div>`;
        }).join('');

        // Lifetime bars
        const maxLifetime = Math.max(...data.lifetime_distribution.map(b => b.count));
        const lifetimeBars = data.lifetime_distribution.map(b => {
            const pct = maxLifetime > 0 ? (b.count / maxLifetime * 100) : 0;
            const colors = ['#ff4444', '#ff6644', '#ff8844', '#ffaa44', '#cccc44', '#88cc44', '#44cc44', '#00c853'];
            const idx = data.lifetime_distribution.indexOf(b);
            return `
                <div class="lifetime-bar-col">
                    <div class="lifetime-count">${b.count}</div>
                    <div class="lifetime-bar" style="height:${pct}%; background:${colors[idx] || '#888'}"></div>
                    <div class="lifetime-label">${b.bucket.replace(' days','d').replace(' years','y').replace(' year','y')}</div>
                </div>`;
        }).join('');

        // Monthly trend
        const maxMonth = Math.max(...data.by_month.map(m => m.events));
        const trendBars = data.by_month.map(m => {
            const pct = maxMonth > 0 ? (m.events / maxMonth * 100) : 0;
            const monthLabel = m.month.split('-')[1];
            const monthNames = {
                '01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun',
                '07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'
            };
            return `
                <div class="trend-col">
                    <div class="trend-value">${m.events}</div>
                    <div class="trend-bar" style="height:${pct}%; background: linear-gradient(180deg, #ff4444, #ff8800)"></div>
                    <div class="trend-label">${monthNames[monthLabel] || monthLabel}</div>
                </div>`;
        }).join('');

        // Net growth indicator
        const isNegative = s.net_new_customers < 0;
        const netColor = isNegative ? '#ff4444' : '#00c853';
        const netSign = isNegative ? '' : '+';

        // Zip table rows
        const zipRows = data.top_zip_codes.slice(0, 10).map(z => `
            <tr>
                <td>${z.zip}</td>
                <td>${z.unique_accounts}</td>
                <td>${z.events}</td>
            </tr>
        `).join('');

        // Recovery opportunity items
        const recoverableReasons = data.by_reason.filter(r => r.recoverable);
        const oppItems = recoverableReasons.map(r => `
            <div class="opp-item">
                <div class="opp-icon">🎯</div>
                <div class="opp-text">
                    <h4>${r.reason}</h4>
                    <p>${r.unique_accounts} accounts · <span class="value">${fmt$(r.annual_value_lost)}/yr</span> recoverable</p>
                </div>
            </div>
        `).join('');

        el.innerHTML = `
            <!-- KPI Row 1: The Headline Numbers -->
            <div class="kpi-row">
                <div class="kpi-card alert">
                    <div class="kpi-value">${fmt$(s.total_annual_value_lost)}</div>
                    <div class="kpi-label">Annual Revenue Lost</div>
                    <div class="kpi-sub">${s.unique_accounts_cancelled} accounts cancelled</div>
                </div>
                <div class="kpi-card warning">
                    <div class="kpi-value">${controllablePct}%</div>
                    <div class="kpi-label">Controllable Cancels</div>
                    <div class="kpi-sub">${s.controllable_events} events · ${fmt$(s.controllable_value_lost)}</div>
                </div>
                <div class="kpi-card success">
                    <div class="kpi-value">${fmt$(s.recoverable_annual_value)}</div>
                    <div class="kpi-label">Recoverable Revenue</div>
                    <div class="kpi-sub">${s.recoverable_accounts} accounts winnable</div>
                </div>
                <div class="kpi-card ${isNegative ? 'alert' : 'success'}">
                    <div class="kpi-value" style="color:${netColor}">${netSign}${s.net_new_customers}</div>
                    <div class="kpi-label">Net Customer Growth</div>
                    <div class="kpi-sub">${s.total_sales_ytd} sales − ${s.unique_accounts_cancelled} cancels</div>
                </div>
            </div>

            <!-- Net Growth Visualizer -->
            <div class="panel" style="margin-bottom:20px">
                <div class="net-growth">
                    <div class="net-block">
                        <div class="num" style="color:#00c853">+${s.total_sales_ytd}</div>
                        <div class="lbl">New Sales</div>
                    </div>
                    <div class="net-arrow">→</div>
                    <div class="net-block">
                        <div class="num" style="color:#ff4444">-${s.unique_accounts_cancelled}</div>
                        <div class="lbl">Cancelled</div>
                    </div>
                    <div class="net-arrow">=</div>
                    <div class="net-block">
                        <div class="num" style="color:${netColor}">${netSign}${s.net_new_customers}</div>
                        <div class="lbl">Net Growth</div>
                    </div>
                </div>
            </div>

            <!-- Recovery Opportunity Banner -->
            <div class="opportunity-card">
                <h3>💰 Win-Back Opportunity: ${fmt$(s.recoverable_annual_value)}/year from ${s.recoverable_accounts} accounts</h3>
                <div class="opportunity-grid">
                    ${oppItems}
                </div>
            </div>

            <!-- Reason Breakdown + Controllable Split -->
            <div class="grid-2">
                <div class="panel">
                    <h3><span class="icon">📊</span>Cancel Reasons (by event count)</h3>
                    <div class="bar-chart">
                        ${reasonBars}
                    </div>
                </div>
                <div>
                    <div class="panel" style="margin-bottom:20px">
                        <h3><span class="icon">🎯</span>Controllable vs Uncontrollable</h3>
                        <div class="donut-container">
                            <div class="donut" style="background:${donutGrad}">
                                <div class="donut-center">
                                    <div class="pct">${controllablePct}%</div>
                                    <div class="lbl">Controllable</div>
                                </div>
                            </div>
                            <div class="legend">
                                <div class="legend-item">
                                    <div class="legend-dot" style="background:#ff8800"></div>
                                    Controllable (${s.controllable_events}) — ${fmt$(s.controllable_value_lost)}
                                </div>
                                <div class="legend-item">
                                    <div class="legend-dot" style="background:#666"></div>
                                    Uncontrollable (${s.uncontrollable_events}) — ${fmt$(s.uncontrollable_value_lost)}
                                </div>
                                <div class="legend-item">
                                    <div class="legend-dot" style="background:#444"></div>
                                    Program Change (${s.structural_events})
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Customer Lifetime at Cancel -->
                    <div class="panel">
                        <h3><span class="icon">⏱️</span>Customer Lifetime at Cancellation</h3>
                        <div style="text-align:center; margin-bottom:12px">
                            <span style="color:#ffaa00; font-size:1.2rem; font-weight:600">
                                Avg: ${(s.avg_customer_lifetime_days / 365).toFixed(1)} years
                            </span>
                            <span style="color:#888; margin-left:12px">
                                Median: ${(s.median_customer_lifetime_days / 365).toFixed(1)} years
                            </span>
                        </div>
                        <div class="lifetime-bars">
                            ${lifetimeBars}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Monthly Trend + Zip Codes -->
            <div class="grid-2">
                <div class="panel">
                    <h3><span class="icon">📅</span>Cancels by Month</h3>
                    <div class="trend-chart">
                        ${trendBars}
                    </div>
                </div>
                <div class="panel">
                    <h3><span class="icon">📍</span>Top Cancel Zip Codes</h3>
                    <table class="zip-table">
                        <thead>
                            <tr><th>Zip Code</th><th>Accounts</th><th>Events</th></tr>
                        </thead>
                        <tbody>${zipRows}</tbody>
                    </table>
                </div>
            </div>

            <!-- Average Value Card -->
            <div class="kpi-row" style="margin-top:20px">
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${fmt$(s.avg_annual_value_per_account)}</div>
                    <div class="kpi-label">Avg Annual Value / Lost Account</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${s.total_cancel_events}</div>
                    <div class="kpi-label">Total Cancel Events</div>
                    <div class="kpi-sub">${(s.total_cancel_events / s.unique_accounts_cancelled).toFixed(1)} events per account avg</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${s.cancel_to_sales_ratio.toFixed(2)}x</div>
                    <div class="kpi-label">Cancel-to-Sales Ratio</div>
                    <div class="kpi-sub">${s.cancel_to_sales_ratio > 1 ? '⚠️ Losing more than gaining' : '✅ Growing'}</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" style="color:#ccc">${data.by_program[0]?.program || 'N/A'}</div>
                    <div class="kpi-label">Most Cancelled Program</div>
                    <div class="kpi-sub">${data.by_program[0]?.events || 0} events · ${fmt$(data.by_program[0]?.annual_value_lost || 0)}</div>
                </div>
            </div>
        `;

        // Update header
        document.getElementById('period').textContent = data.period || 'YTD 2026';
        const ts = data.generated_at ? new Date(data.generated_at) : null;
        document.getElementById('updated').textContent = ts
            ? 'Updated: ' + ts.toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})
            : '';
    }

    loadData().then(data => {
        if (data) render(data);
    });
    </script>
    <script src="navigator.js"></script>
</body>
</html>
