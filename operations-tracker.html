<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MoJo Operations Tracker</title>
  <style>
    :root{--bg:#0f0f1a;--panel:#17172a;--line:#303047;--text:#f7f7fb;--muted:#a6a6bb;--gold:#ffd43b;--green:#34d399;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:920px;margin:auto;padding:24px 16px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
    h1{font-size:clamp(1.55rem,5vw,2.25rem);margin:0}.eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem}
    .muted{color:var(--muted)}a{color:var(--gold)}.panel{background:linear-gradient(145deg,#1b1b31,#151528);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
    .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role{border:1px solid var(--line);border-radius:12px;padding:16px;background:#111120;color:var(--text);text-align:left;cursor:pointer}
    .role strong{display:block;font-size:1.05rem}.role.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffd43b25}.role small{color:var(--muted)}
    label.title{display:block;font-weight:800;margin:20px 0 8px}input,textarea,select{width:100%;background:#10101e;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px;font:inherit}textarea{min-height:96px;resize:vertical}
    .tasks{display:grid;gap:9px}.task{display:grid;grid-template-columns:24px 1fr 120px auto;gap:10px;align-items:center;background:#111120;border:1px solid #28283d;border-radius:10px;padding:11px}.task input[type=checkbox]{width:18px;height:18px}.task select{padding:8px}.note-btn{border:1px solid #4a4a68;background:#24243a;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}.task-note{grid-column:2/-1;min-height:68px}.task-note.hidden{display:none}.note-btn.has-note{border-color:var(--gold);color:var(--gold)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--gold);color:#18130a}.secondary{background:#2a2a40;color:#fff}.note{border-left:3px solid var(--gold);padding-left:12px;color:var(--muted);font-size:.9rem}
    .hidden{display:none}.required{color:var(--red)}#status{margin-top:12px;color:var(--green)}
    @media(max-width:650px){.roles{grid-template-columns:1fr}.task{grid-template-columns:24px 1fr auto}.task select{grid-column:2}.task-note{grid-column:2/-1}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Mosquito Joe of Miami</div><h1>Operations Tracker</h1><div class="muted">Weekly and monthly accountability for office and field operations</div></div><a href="./">← Command Center</a></header>
  <div class="panel">
    <div class="eyebrow">1 · Select your role</div>
    <div class="roles" style="margin-top:12px">
      <button class="role" data-role="Travis"><strong>Travis</strong><small>Operations Manager · Office / Systems</small></button>
      <button class="role" data-role="Jorge"><strong>Jorge</strong><small>Field Operations Manager · Tech Oversight</small></button>
    </div>
  </div>
  <form id="report" class="panel hidden">
    <div class="eyebrow">2 · Select report</div>
    <div class="roles" style="margin-top:12px"><button type="button" class="role cadence active" data-cadence="Weekly"><strong>Weekly</strong><small>Execution and immediate follow-up</small></button><button type="button" class="role cadence" data-cadence="Monthly"><strong>Monthly</strong><small>Audits, trends, and compliance</small></button></div>
    <label class="title" for="period"><span id="periodLabel">Week ending</span> <span class="required">*</span></label><input type="date" id="period" required>
    <label class="title" for="employeePin">Your PIN <span class="required">*</span></label><input type="password" id="employeePin" inputmode="numeric" autocomplete="current-password" maxlength="12" required placeholder="Enter your assigned PIN">
    <label class="title">Task status</label><div id="tasks" class="tasks"></div>
    <label class="title" for="wins">Wins / work completed</label><textarea id="wins" placeholder="What got done this week?"></textarea>
    <label class="title" for="issues">Issues, blockers, or follow-up needed</label><textarea id="issues" placeholder="What needs attention, resources, or a decision?"></textarea>
    <label class="title" for="next">Priorities for next period</label><textarea id="next" placeholder="Top priorities and commitments for the next reporting period"></textarea>
    <label class="title" for="safety">Safety / compliance notes</label><textarea id="safety" placeholder="Incidents, risks, expiring items, or corrective action"></textarea>
    <div class="actions"><button class="btn primary" id="submitBtn" type="submit">Submit weekly report</button><button class="btn secondary" type="button" id="draft">Save draft on this device</button></div>
    <div id="status"></div>
  </form>
  <div class="panel"><div class="eyebrow">Management</div><p class="note">Enter the owner PIN to load submitted weekly and monthly reports. No GitHub account is required.</p><label class="title" for="ownerPin">Owner PIN</label><input type="password" id="ownerPin" inputmode="numeric" maxlength="12" placeholder="Enter owner PIN"><div class="actions"><button class="btn secondary" id="managerReports" type="button">Load submitted reports</button></div><div id="reportHistory" class="tasks" style="margin-top:16px"></div></div>
</main>
<script>
const tasks={Travis:{
Weekly:["Inventory levels checked and reorders placed as needed","Yesterday's pending to-do list reviewed and followed up","Reports, product ordering, and ClickUp tasks completed","Tech meeting agenda prepared and meeting led with Jorge","Customer complaints/issues followed up with Bev","Resources and support coordinated for Jorge","Weekly operations report: jobs, callbacks, revenue vs projections","Vehicle logs and maintenance status reviewed with Jorge","Next-day vehicle and technician readiness confirmed"],
Monthly:["Full chemical, PPE, and equipment inventory audit","Driver licenses, insurance, permits, and compliance documents audited","Blower maintenance schedule reviewed for upcoming service","Technician training progress and safety standards reviewed","New-hire onboarding files and documentation audited","Customer complaint trends and corrective actions reviewed","Operations systems, reporting, and ClickUp process reviewed"]},Jorge:{
Weekly:["Morning vehicle and equipment inspections completed","Vehicle maintenance and mechanic coordination handled","Blower/equipment gas and maintenance standards enforced","Warehouse readiness, cleanliness, and safety spot checks completed","Supply pickups completed as needed","Field spot checks completed: quality, uniform, customer interaction","Morning truck checkout and evening check-in supported","Daily field issues reported to Travis","Formal weekly vehicle inspections submitted","Shadowed 1–2 technicians in the field","Weekly field issue summary delivered before meeting"],
Monthly:["Full vehicle condition and upcoming maintenance audit","Warehouse deep check: cleanliness, safety, and chemical storage compliance","Equipment maintenance compliance audited across technicians","Field quality trends and recurring coaching needs summarized","Supply pickup, gas, repair, and mechanic needs forecasted","Truck checkout/check-in process reviewed for recurring issues","Monthly field safety issues and corrective actions summarized"]}};
const API='https://mojo-operations-api.mojoe-miami.workers.dev';
let role="",cadence="Weekly";const form=document.querySelector('#report'),taskBox=document.querySelector('#tasks'),statusEl=document.querySelector('#status');
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.querySelector('#managerReports').onclick=async()=>{const box=document.querySelector('#reportHistory'),pin=ownerPin.value.trim();if(!pin)return;box.innerHTML='<div class="muted">Loading reports…</div>';try{const res=await fetch(API+'/reports',{headers:{'X-Operations-Pin':pin}}),payload=await res.json();if(!res.ok)throw Error(payload.error||'Unable to load reports');box.innerHTML=payload.reports.length?payload.reports.map(r=>{const complete=r.items.filter(x=>x.done).length;return `<details class="panel" style="margin:0"><summary><strong>${esc(r.manager)} · ${esc(r.cadence)}</strong> — ${esc(r.period_end)} (${complete}/${r.items.length})</summary><div style="margin-top:12px">${r.items.map(x=>`<p>${x.done?'✅':'⬜'} ${esc(x.task)} — <strong>${esc(x.status)}</strong>${x.note?`<br><span class="muted">${esc(x.note)}</span>`:''}</p>`).join('')}<p><strong>Wins:</strong> ${esc(r.wins)||'—'}</p><p><strong>Issues:</strong> ${esc(r.issues)||'—'}</p><p><strong>Next:</strong> ${esc(r.next_priorities)||'—'}</p><p><strong>Safety:</strong> ${esc(r.safety)||'—'}</p></div></details>`}).join(''):'<div class="muted">No reports submitted yet.</div>'}catch(err){box.innerHTML=`<div class="required">${esc(err.message)}</div>`}};
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b));form.classList.remove('hidden');refresh();form.scrollIntoView({behavior:'smooth',block:'start'})});
document.querySelectorAll('.cadence').forEach(b=>b.onclick=()=>{cadence=b.dataset.cadence;document.querySelectorAll('.cadence').forEach(x=>x.classList.toggle('active',x===b));refresh()});
function refresh(){document.querySelector('#periodLabel').textContent=cadence==='Weekly'?'Week ending':'Month ending';document.querySelector('#submitBtn').textContent=`Submit ${cadence.toLowerCase()} report`;render();restore()}
function render(){const list=tasks[role][cadence];taskBox.innerHTML=list.map((t,i)=>`<div class="task"><input type="checkbox" id="t${i}"><label for="t${i}">${esc(t)}</label><select aria-label="Status for ${esc(t)}"><option>Complete</option><option>In progress</option><option>Needs attention</option><option>Not applicable</option></select><button type="button" class="note-btn" aria-expanded="false" aria-controls="note${i}">+ Note</button><textarea class="task-note hidden" id="note${i}" placeholder="Add details, follow-up, quantity, date, or issue for this task"></textarea></div>`).join('');taskBox.querySelectorAll('.note-btn').forEach(btn=>btn.onclick=()=>{const note=document.querySelector('#'+btn.getAttribute('aria-controls'));const opening=note.classList.contains('hidden');note.classList.toggle('hidden');btn.setAttribute('aria-expanded',opening);btn.textContent=opening?'Hide note':(note.value.trim()?'Edit note':'+ Note');if(opening)note.focus()});taskBox.querySelectorAll('.task-note').forEach(note=>note.addEventListener('input',()=>{const btn=note.parentElement.querySelector('.note-btn');btn.classList.toggle('has-note',!!note.value.trim());btn.textContent=note.value.trim()?'Edit note':'Hide note'}))}
function storageKey(){return'mojo-ops-'+role+'-'+cadence.toLowerCase()}function data(){return{role,manager:role,cadence,period:period.value,wins:wins.value,issues:issues.value,next:next.value,safety:safety.value,items:[...taskBox.querySelectorAll('.task')].map((x,i)=>({task:tasks[role][cadence][i],done:x.querySelector('input[type=checkbox]').checked,status:x.querySelector('select').value,note:x.querySelector('.task-note').value.trim()}))}}
function restore(){wins.value=issues.value=next.value=safety.value='';try{const d=JSON.parse(localStorage.getItem(storageKey())||'null');if(!d)return;period.value=d.period||period.value;wins.value=d.wins||'';issues.value=d.issues||'';next.value=d.next||'';safety.value=d.safety||'';d.items?.forEach((v,i)=>{const row=taskBox.children[i];if(row){row.querySelector('input[type=checkbox]').checked=v.done;row.querySelector('select').value=v.status;const note=row.querySelector('.task-note'),btn=row.querySelector('.note-btn');note.value=v.note||'';btn.classList.toggle('has-note',!!note.value);btn.textContent=note.value?'Edit note':'+ Note'}})}catch(e){}}
function saveDraft(silent=false){if(!role)return;localStorage.setItem(storageKey(),JSON.stringify(data()));if(!silent)statusEl.textContent=`${cadence} draft saved on this device.`}document.querySelector('#draft').onclick=()=>saveDraft();
form.onsubmit=async e=>{e.preventDefault();const d=data(),pin=employeePin.value.trim();if(!d.period||!pin)return;const btn=document.querySelector('#submitBtn');btn.disabled=true;btn.textContent='Submitting…';statusEl.textContent='';try{const res=await fetch(API+'/reports',{method:'POST',headers:{'Content-Type':'application/json','X-Operations-Pin':pin},body:JSON.stringify(d)}),payload=await res.json();if(!res.ok)throw Error(payload.error||'Submission failed');localStorage.removeItem(storageKey());statusEl.textContent=`Report #${payload.id} submitted successfully.`;employeePin.value='';form.reset();period.value=new Date().toISOString().slice(0,10);render()}catch(err){statusEl.textContent='Error: '+err.message}finally{btn.disabled=false;btn.textContent=`Submit ${cadence.toLowerCase()} report`}}
const now=new Date(),day=now.getDay(),delta=(5-day+7)%7;now.setDate(now.getDate()+delta);period.value=now.toISOString().slice(0,10);
</script></body></html>
