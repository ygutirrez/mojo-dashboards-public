<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoJo CSR Performance</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card-border: #1e1e2e;
            --text: #e4e4e7;
            --text-muted: #71717a;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --orange: #f97316;
            --purple: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 12px;
            opacity: 0.8;
        }
        .back-link:hover { opacity: 1; }
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

        /* Team summary strip */
        .team-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .team-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .team-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .team-card .value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
        }
        .team-card .sub-val {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Section */
        .section {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .section h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .tab-btn.active { background: rgba(59,130,246,0.15); color: var(--accent); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Charts */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 0 8px;
        }
        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .bar-pair {
            display: flex;
            gap: 3px;
            align-items: flex-end;
        }
        .bar {
            border-radius: 4px 4px 0 0;
            min-height: 3px;
            position: relative;
        }
        .bar.sales { background: var(--green); }
        .bar.cancels { background: var(--red); opacity: 0.7; }
        .bar-val {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }
        .bar-lbl {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* CSR cards */
        .csr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .csr-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .csr-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--csr-color, var(--accent));
        }
        .csr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .csr-name { font-size: 20px; font-weight: 700; }
        .csr-rank {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .rank-1 { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
        .rank-2 { background: rgba(192, 192, 192, 0.15); color: #c0c0c0; }
        .rank-3 { background: rgba(205, 127, 50, 0.15); color: #cd7f32; }

        .csr-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .csr-stat { text-align: center; }
        .csr-stat .val { font-size: 20px; font-weight: 700; }
        .csr-stat .lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Win rate meter */
        .win-meter {
            width: 100%;
            height: 8px;
            background: var(--red);
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
            opacity: 0.6;
        }
        .win-meter-fill {
            height: 100%;
            background: var(--green);
            border-radius: 4px;
            transition: width 0.5s;
        }
        .win-meter-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Mini chart */
        .mini-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 60px;
            margin: 12px 0;
            padding: 0 4px;
        }
        .chart-bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .chart-bars {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 50px;
        }
        .chart-bar {
            width: 12px;
            border-radius: 3px 3px 0 0;
            min-height: 2px;
        }
        .chart-bar.sales { background: var(--green); opacity: 0.8; }
        .chart-bar.cancels { background: var(--red); opacity: 0.6; }
        .chart-label { font-size: 9px; color: var(--text-muted); white-space: nowrap; }

        /* Trend badge */
        .trend-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
        }
        .trend-up { background: rgba(34, 197, 94, 0.12); color: var(--green); }
        .trend-down { background: rgba(239, 68, 68, 0.12); color: var(--red); }
        .trend-flat { background: rgba(234, 179, 8, 0.12); color: var(--yellow); }

        /* Tags */
        .cat-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .cat-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.12);
            color: var(--accent);
        }
        .cat-tag.cancel { background: rgba(239, 68, 68, 0.1); color: var(--red); }
        .cat-tag.competitor { background: rgba(234, 179, 8, 0.1); color: var(--yellow); }

        /* Insights callout */
        .insight-box {
            background: rgba(59, 130, 246, 0.06);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.5;
        }
        .insight-box strong { color: var(--accent); }
        .insight-box .alert { color: var(--red); }
        .insight-box .good { color: var(--green); }

        /* Streak badge */
        .streak-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .streak-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .streak-item .val { font-weight: 700; color: var(--text); }

        /* Doughnut chart */
        .reason-chart {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .reason-bars {
            flex: 1;
            min-width: 200px;
        }
        .reason-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .reason-bar-bg {
            flex: 1;
            height: 18px;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            overflow: hidden;
        }
        .reason-bar-fill {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 6px;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }
        .reason-label { min-width: 100px; white-space: nowrap; }
        .reason-pct { min-width: 36px; text-align: right; font-weight: 600; color: var(--text-muted); }

        /* Activity feed */
        .activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-type {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            min-width: 52px;
            text-align: center;
        }
        .type-sale { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .type-cancel { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .activity-date { color: var(--text-muted); font-size: 11px; min-width: 60px; }
        .activity-csr { font-weight: 600; min-width: 55px; }

        /* Monthly comparison */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .month-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
        }
        .month-card .month-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent);
        }
        .month-card .month-stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 4px;
        }

        .footer {
            text-align: center;
            padding: 16px 0;
            color: var(--text-muted);
            font-size: 11px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .csr-grid { grid-template-columns: 1fr; }
            .team-strip { grid-template-columns: repeat(2, 1fr); }
            .csr-stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <a href="hub.html" class="back-link">← Back to Hub</a>

    <div class="header">
        <h1>🏆 CSR Performance</h1>
        <div class="sub" id="headerSub">Loading...</div>
    </div>

    <div id="insights" class="insight-box" style="display:none;"></div>
    <div id="teamStrip" class="team-strip"></div>

    <div class="tab-bar" id="mainTabs">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="trends">Trends</button>
        <button class="tab-btn" data-tab="cancels">Cancel Analysis</button>
        <button class="tab-btn" data-tab="activity">Activity Feed</button>
    </div>

    <div id="tab-overview" class="tab-content active">
        <div id="teamChart" class="section"></div>
        <div id="csrGrid" class="csr-grid"></div>
    </div>

    <div id="tab-trends" class="tab-content">
        <div id="monthlyComparison" class="section"></div>
        <div id="csrMonthly" class="section"></div>
    </div>

    <div id="tab-cancels" class="tab-content">
        <div id="cancelBreakdown" class="section"></div>
        <div id="csrCancelCards"></div>
    </div>

    <div id="tab-activity" class="tab-content">
        <div id="activityFeed" class="section"></div>
    </div>

    <div class="footer">
        Auto-refreshes every 5 minutes · <span id="lastUpdate">—</span>
    </div>

    <script>
        const CSR_COLORS = {
            'Norma': '#f97316',
            'Lucy': '#8b5cf6',
            'Bev': '#3b82f6'
        };
        const CANCEL_COLORS = ['#ef4444','#f97316','#eab308','#8b5cf6','#3b82f6','#06b6d4','#22c55e','#ec4899'];

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        async function loadData() {
            try {
                const r = await fetch('csr-performance-data.json?t=' + Date.now());
                if (!r.ok) throw new Error('Failed to load');
                const data = await r.json();
                render(data);
            } catch (e) {
                document.getElementById('headerSub').textContent = 'Error loading data: ' + e.message;
            }
        }

        function render(data) {
            const { team, csrs, recentActivity } = data;

            // Header
            document.getElementById('headerSub').textContent =
                `${data.period} · ${data.days_tracked} days tracked · Updated ${new Date(data.updated_at).toLocaleString()}`;
            document.getElementById('lastUpdate').textContent = new Date(data.updated_at).toLocaleString();

            // AI Insights
            renderInsights(data);

            // Team strip
            const salesPerDay = data.days_tracked > 0 ? (team.totalSales / data.days_tracked).toFixed(1) : '—';
            const cancelsPerDay = data.days_tracked > 0 ? (team.totalCancels / data.days_tracked).toFixed(1) : '—';
            const bestCSR = csrs.length > 0 ? csrs.reduce((a, b) => a.winRate > b.winRate ? a : b) : null;

            document.getElementById('teamStrip').innerHTML = `
                <div class="team-card">
                    <div class="label">Team Sales</div>
                    <div class="value" style="color: var(--green);">${team.totalSales}</div>
                    <div class="sub-val">${salesPerDay}/day</div>
                </div>
                <div class="team-card">
                    <div class="label">Team Cancels</div>
                    <div class="value" style="color: var(--red);">${team.totalCancels}</div>
                    <div class="sub-val">${cancelsPerDay}/day</div>
                </div>
                <div class="team-card">
                    <div class="label">Net</div>
                    <div class="value" style="color: ${team.net >= 0 ? 'var(--green)' : 'var(--red)'};">${team.net >= 0 ? '+' : ''}${team.net}</div>
                    <div class="sub-val">${team.net < 0 ? 'losing customers' : 'growing'}</div>
                </div>
                <div class="team-card">
                    <div class="label">Win Rate</div>
                    <div class="value" style="color: ${team.winRate >= 50 ? 'var(--green)' : team.winRate >= 35 ? 'var(--yellow)' : 'var(--red)'};">${team.winRate}%</div>
                    <div class="sub-val">target: 50%+</div>
                </div>
                <div class="team-card">
                    <div class="label">Top CSR</div>
                    <div class="value" style="font-size: 18px; color: ${CSR_COLORS[bestCSR?.name] || 'var(--text)'};">${bestCSR?.name || '—'}</div>
                    <div class="sub-val">${bestCSR?.winRate || 0}% win rate</div>
                </div>
            `;

            // Overview tab
            renderTeamChart(team.weeklyTrend || []);
            renderCSRCards(csrs);

            // Trends tab
            renderMonthlyComparison(team, csrs);
            renderCSRMonthly(csrs);

            // Cancel tab
            renderCancelBreakdown(team, csrs);

            // Activity tab
            renderActivity(recentActivity || []);
        }

        function renderInsights(data) {
            const el = document.getElementById('insights');
            const { team, csrs } = data;
            const lines = [];

            // Win rate alert
            if (team.winRate < 40) {
                lines.push(`<span class="alert">⚠️ Team win rate is ${team.winRate}% — below the 40% minimum.</span> ${team.totalCancels - team.totalSales} more cancels than sales YTD.`);
            }

            // CSR-specific insights
            for (const csr of csrs) {
                if (csr.trend === 'up' && csr.trendPct > 50) {
                    lines.push(`<span class="good">📈 ${csr.name} is surging</span> — sales up ${csr.trendPct}% over the last 2 weeks vs prior 2.`);
                }
                if (csr.trend === 'down' && csr.trendPct < -30) {
                    lines.push(`<span class="alert">📉 ${csr.name} trending down</span> — sales dropped ${Math.abs(csr.trendPct)}% over the last 2 weeks.`);
                }
                if (csr.winRate >= 50) {
                    lines.push(`<span class="good">✅ ${csr.name} has a ${csr.winRate}% win rate</span> — only CSR above 50%.`);
                }
            }

            // Cancel concentration
            const topReason = (team.topCancelReasons || [])[0];
            if (topReason && topReason.pct > 30) {
                lines.push(`<strong>${topReason.reason}</strong> is the #1 cancel reason at ${topReason.pct}% of all cancels (${topReason.count} total).`);
            }

            if (lines.length > 0) {
                el.style.display = 'block';
                el.innerHTML = lines.join('<br>');
            }
        }

        function renderTeamChart(weeks) {
            const el = document.getElementById('teamChart');
            if (!weeks.length) { el.innerHTML = ''; return; }
            const maxVal = Math.max(...weeks.map(w => Math.max(w.sales, w.cancels)), 1);

            el.innerHTML = `
                <h2>📈 Team Weekly Trend</h2>
                <div class="bar-chart" style="height: 120px;">
                    ${weeks.map(w => {
                        const sH = Math.max(3, (w.sales / maxVal) * 90);
                        const cH = Math.max(3, (w.cancels / maxVal) * 90);
                        return `
                            <div class="bar-group">
                                <div class="bar-pair" style="height: 100px;">
                                    <div class="bar sales" style="height: ${sH}px; width: 20px;">
                                        <span class="bar-val" style="color: var(--green);">${w.sales}</span>
                                    </div>
                                    <div class="bar cancels" style="height: ${cH}px; width: 20px;">
                                        <span class="bar-val" style="color: var(--red);">${w.cancels}</span>
                                    </div>
                                </div>
                                <span class="bar-lbl">${w.week}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
                <div class="legend">
                    <span><span class="legend-dot" style="background: var(--green);"></span> Sales</span>
                    <span><span class="legend-dot" style="background: var(--red); opacity:0.7;"></span> Cancels</span>
                </div>
            `;
        }

        function renderCSRCards(csrs) {
            const el = document.getElementById('csrGrid');
            el.innerHTML = csrs.map((csr, i) => {
                const color = CSR_COLORS[csr.name] || 'var(--accent)';
                const trendIcon = csr.trend === 'up' ? '↑' : csr.trend === 'down' ? '↓' : '→';
                const trendClass = csr.trend === 'up' ? 'trend-up' : csr.trend === 'down' ? 'trend-down' : 'trend-flat';
                const trendText = csr.trendPct !== 0 ? `${csr.trendPct > 0 ? '+' : ''}${csr.trendPct}%` : csr.trend;

                // Mini chart
                const weeks = csr.weeklyTrend || [];
                const maxW = Math.max(...weeks.map(w => Math.max(w.sales, w.cancels)), 1);
                const miniChart = weeks.map(w => {
                    const sH = Math.max(2, (w.sales / maxW) * 45);
                    const cH = Math.max(2, (w.cancels / maxW) * 45);
                    return `
                        <div class="chart-bar-group">
                            <div class="chart-bars">
                                <div class="chart-bar sales" style="height: ${sH}px"></div>
                                <div class="chart-bar cancels" style="height: ${cH}px"></div>
                            </div>
                            <span class="chart-label">${w.week}</span>
                        </div>
                    `;
                }).join('');

                // Categories
                const catTags = (csr.topCategories || []).map(c =>
                    `<span class="cat-tag">${c.category} (${c.count})</span>`
                ).join('');

                // Cancel reasons (top 3)
                const cancelTags = (csr.topCancelReasons || []).slice(0, 3).map(c =>
                    `<span class="cat-tag cancel">${c.reason} (${c.count})</span>`
                ).join('');

                // Streaks
                const s = csr.streaks || {};
                const streakHTML = `
                    <div class="streak-row">
                        <div class="streak-item">🔥 <span class="val">${s.currentStreak || 0}</span> day streak</div>
                        <div class="streak-item">⭐ Best: <span class="val">${s.bestStreak || 0}</span> days</div>
                        <div class="streak-item">📊 <span class="val">${s.consistency || 0}%</span> consistency</div>
                    </div>
                `;

                // Best/worst weeks
                let peaksHTML = '';
                if (csr.bestWeek || csr.worstWeek) {
                    peaksHTML = `<div class="streak-row">`;
                    if (csr.bestWeek) peaksHTML += `<div class="streak-item" style="color:var(--green);">Best: ${csr.bestWeek.week} (${csr.bestWeek.net >= 0 ? '+' : ''}${csr.bestWeek.net} net)</div>`;
                    if (csr.worstWeek) peaksHTML += `<div class="streak-item" style="color:var(--red);">Worst: ${csr.worstWeek.week} (${csr.worstWeek.net} net)</div>`;
                    peaksHTML += `</div>`;
                }

                return `
                    <div class="csr-card" style="--csr-color: ${color}">
                        <div class="csr-header">
                            <span class="csr-name">${csr.name}</span>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span class="trend-badge ${trendClass}">${trendIcon} ${trendText}</span>
                                <span class="csr-rank rank-${i+1}">#${i+1}</span>
                            </div>
                        </div>

                        <div class="csr-stats">
                            <div class="csr-stat">
                                <div class="val" style="color: var(--green);">${csr.totalSales}</div>
                                <div class="lbl">Sales</div>
                            </div>
                            <div class="csr-stat">
                                <div class="val" style="color: var(--red);">${csr.totalCancels}</div>
                                <div class="lbl">Cancels</div>
                            </div>
                            <div class="csr-stat">
                                <div class="val" style="color: ${csr.net >= 0 ? 'var(--green)' : 'var(--red)'};">${csr.net >= 0 ? '+' : ''}${csr.net}</div>
                                <div class="lbl">Net</div>
                            </div>
                            <div class="csr-stat">
                                <div class="val" style="color: ${csr.winRate >= 50 ? 'var(--green)' : csr.winRate >= 35 ? 'var(--yellow)' : 'var(--red)'};">${csr.winRate}%</div>
                                <div class="lbl">Win Rate</div>
                            </div>
                        </div>

                        <div class="win-meter">
                            <div class="win-meter-fill" style="width: ${csr.winRate}%"></div>
                        </div>
                        <div class="win-meter-labels">
                            <span>Cancels ${csr.totalCancels}</span>
                            <span>Sales ${csr.totalSales}</span>
                        </div>

                        <div class="mini-chart">${miniChart}</div>

                        ${streakHTML}
                        ${peaksHTML}

                        ${catTags ? `<div style="font-size: 11px; color: var(--text-muted); margin-top: 10px;">Sale Types:</div><div class="cat-list">${catTags}</div>` : ''}
                        ${cancelTags ? `<div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">Cancel Reasons:</div><div class="cat-list">${cancelTags}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderMonthlyComparison(team, csrs) {
            const el = document.getElementById('monthlyComparison');
            const months = team.monthlyTrend || [];
            if (!months.length) { el.innerHTML = ''; return; }

            const maxVal = Math.max(...months.map(m => Math.max(m.sales, m.cancels)), 1);

            el.innerHTML = `
                <h2>📅 Monthly Team Comparison</h2>
                <div class="month-grid">
                    ${months.map(m => `
                        <div class="month-card">
                            <div class="month-name">${m.month}</div>
                            <div class="month-stats">
                                <span style="color: var(--green);">✅ ${m.sales} sales</span>
                                <span style="color: var(--red);">❌ ${m.cancels} cancels</span>
                                <span style="color: ${m.net >= 0 ? 'var(--green)' : 'var(--red)'}; font-weight: 700;">${m.net >= 0 ? '+' : ''}${m.net}</span>
                            </div>
                            <div class="win-meter" style="margin-top: 8px;">
                                <div class="win-meter-fill" style="width: ${(m.sales + m.cancels) > 0 ? ((m.sales/(m.sales+m.cancels))*100) : 0}%"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCSRMonthly(csrs) {
            const el = document.getElementById('csrMonthly');
            const rows = csrs.map(csr => {
                const color = CSR_COLORS[csr.name] || 'var(--accent)';
                const months = csr.monthlyTrend || [];
                if (!months.length) return '';

                return `
                    <div style="margin-bottom: 16px;">
                        <div style="font-weight: 600; color: ${color}; margin-bottom: 8px;">${csr.name}</div>
                        <div class="month-grid">
                            ${months.map(m => `
                                <div class="month-card">
                                    <div class="month-name" style="color: ${color};">${m.month}</div>
                                    <div class="month-stats">
                                        <span style="color: var(--green);">${m.sales}S</span>
                                        <span style="color: var(--red);">${m.cancels}C</span>
                                        <span style="color: ${m.net >= 0 ? 'var(--green)' : 'var(--red)'};">${m.net >= 0 ? '+' : ''}${m.net}</span>
                                        <span style="color: var(--text-muted);">${m.winRate}%</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            el.innerHTML = `<h2>👤 CSR Monthly Breakdown</h2>${rows}`;
        }

        function renderCancelBreakdown(team, csrs) {
            const el = document.getElementById('cancelBreakdown');
            const reasons = team.topCancelReasons || [];
            if (!reasons.length) { el.innerHTML = ''; return; }

            const maxCount = Math.max(...reasons.map(r => r.count), 1);

            const barsHTML = reasons.map((r, i) => {
                const color = CANCEL_COLORS[i % CANCEL_COLORS.length];
                const width = Math.max(5, (r.count / maxCount) * 100);
                return `
                    <div class="reason-row">
                        <span class="reason-label">${r.reason}</span>
                        <div class="reason-bar-bg">
                            <div class="reason-bar-fill" style="width: ${width}%; background: ${color};">${r.count}</div>
                        </div>
                        <span class="reason-pct">${r.pct}%</span>
                    </div>
                `;
            }).join('');

            el.innerHTML = `
                <h2>❌ Cancel Reason Breakdown (Team)</h2>
                <div class="reason-bars">${barsHTML}</div>
            `;

            // Per-CSR cancel cards
            const csrCards = document.getElementById('csrCancelCards');
            csrCards.innerHTML = csrs.map(csr => {
                const reasons = csr.topCancelReasons || [];
                if (!reasons.length) return '';
                const color = CSR_COLORS[csr.name] || 'var(--accent)';
                const maxC = Math.max(...reasons.map(r => r.count), 1);

                return `
                    <div class="section" style="border-top: 3px solid ${color};">
                        <h2 style="color: ${color};">${csr.name} — Cancel Reasons</h2>
                        ${reasons.map((r, i) => {
                            const barColor = CANCEL_COLORS[i % CANCEL_COLORS.length];
                            const w = Math.max(5, (r.count / maxC) * 100);
                            return `
                                <div class="reason-row">
                                    <span class="reason-label">${r.reason}</span>
                                    <div class="reason-bar-bg">
                                        <div class="reason-bar-fill" style="width: ${w}%; background: ${barColor};">${r.count}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        ${(csr.competitorLosses || []).length > 0 ? `
                            <div style="margin-top: 10px; font-size: 11px; color: var(--text-muted);">Lost to Competitors:</div>
                            <div class="cat-list">${csr.competitorLosses.map(c => `<span class="cat-tag competitor">${c.competitor} (${c.count})</span>`).join('')}</div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderActivity(activities) {
            const el = document.getElementById('activityFeed');
            if (!activities.length) { el.innerHTML = ''; return; }

            const rows = activities.slice(0, 25).map(a => {
                const typeClass = a.type === 'Sale' ? 'type-sale' : 'type-cancel';
                const d = new Date(a.date + 'T00:00:00');
                const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return `
                    <div class="activity-item">
                        <span class="activity-date">${dateStr}</span>
                        <span class="activity-type ${typeClass}">${a.type}</span>
                        <span class="activity-csr" style="color: ${CSR_COLORS[a.csr] || 'var(--text)'};">${a.csr}</span>
                        <span>${a.customer}</span>
                        <span style="margin-left: auto; color: var(--text-muted); font-size: 11px;">${a.category}</span>
                    </div>
                `;
            }).join('');

            el.innerHTML = `<h2>📋 Recent Activity (Last 25)</h2>${rows}`;
        }

        loadData();
        setInterval(loadData, 5 * 60 * 1000);
    </script>
    <script src="navigator.js"></script>
</body>
</html>
