<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta http-equiv="refresh" content="300">
    <title>MoJo Ops — TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1920px; height: 1080px; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            color: #e6edf3;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #ff6b35, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .header .meta { text-align: right; font-size: 0.8rem; color: #8b949e; }
        .live-dot {
            display: inline-block; width: 8px; height: 8px;
            background: #3fb950; border-radius: 50%; margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

        /* Main grid — fills remaining space */
        .main { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }

        /* Top KPI bar spans all 3 cols */
        .kpi-bar {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }
        .kpi {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
        }
        .kpi .val { font-size: 2rem; font-weight: 700; line-height: 1.1; }
        .kpi .lbl { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .g { color: #3fb950; } .y { color: #d29922; } .r { color: #f85149; } .b { color: #58a6ff; } .o { color: #ff6b35; }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card h2 {
            font-size: 0.75rem; color: #8b949e; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 10px; flex-shrink: 0;
        }
        .card-body { flex: 1; overflow: hidden; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        th { text-align: left; padding: 6px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #8b949e; font-size: 0.65rem; text-transform: uppercase; font-weight: 500; }
        td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tr.crit { background: rgba(248,81,73,0.08); }
        tr.warn { background: rgba(210,153,34,0.08); }

        .badge { padding: 2px 7px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .badge.good { background: rgba(63,185,80,0.2); color: #3fb950; }
        .badge.monitor { background: rgba(210,153,34,0.2); color: #d29922; }
        .badge.coach, .badge.service { background: rgba(248,81,73,0.2); color: #f85149; }

        /* Alerts */
        .alert { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.78rem; }
        .alert.critical { background: rgba(248,81,73,0.12); border-left: 3px solid #f85149; }
        .alert.warning { background: rgba(210,153,34,0.12); border-left: 3px solid #d29922; }
        .alert strong { display: block; margin-bottom: 2px; }
        .alert span { color: #8b949e; font-size: 0.72rem; }

        /* Blower list */
        .blower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.75rem; }
        .blower-item { padding: 4px 6px; border-radius: 4px; background: rgba(255,255,255,0.02); }
        .blower-item.issue { background: rgba(210,153,34,0.08); }

        .footer { text-align: center; font-size: 0.65rem; color: #484f58; margin-top: 8px; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦟 MoJo Operations Command Center</h1>
        <div class="meta">
            <div><span class="live-dot"></span>Live Data • Auto-refresh 5 min</div>
            <div id="lastUpdate"></div>
        </div>
    </div>

    <div class="main" id="dashboard">
        <div class="kpi-bar" style="grid-column: 1/-1;">
            <div class="kpi"><div class="val g">—</div><div class="lbl">Loading...</div></div>
        </div>
    </div>

    <div class="footer">Fleet: Zubie • Equipment: RFID • WOs: ServSuite • Mosquito Joe of Miami 🦟</div>

    <script>
    async function load() {
        try {
            const res = await fetch('ops-data.json?t=' + Date.now());
            const d = await res.json();
            render(d);
        } catch(e) {
            document.getElementById('dashboard').innerHTML = '<div style="text-align:center;padding:40px;color:#8b949e;">⚠️ Could not load data — retrying in 5 min</div>';
        }
    }

    function render(d) {
        const s = d.summary;
        const up = new Date(d.updated_at).toLocaleString();
        document.getElementById('lastUpdate').textContent = 'Updated: ' + up;

        const safetyClass = s.avg_safety_score >= 80 ? 'g' : s.avg_safety_score >= 50 ? 'y' : 'r';
        const codesClass = s.vehicles_with_codes > 5 ? 'r' : s.vehicles_with_codes > 0 ? 'y' : 'g';

        let html = '';

        // ── KPI Bar ──
        html += `<div class="kpi-bar" style="grid-column:1/-1;">
            <div class="kpi"><div class="val g">${s.total_vehicles}</div><div class="lbl">Vehicles</div></div>
            <div class="kpi"><div class="val b">${s.blowers_active}</div><div class="lbl">Blowers</div></div>
            <div class="kpi"><div class="val ${safetyClass}">${s.avg_safety_score}</div><div class="lbl">Avg Safety</div></div>
            <div class="kpi"><div class="val g">${s.total_miles.toLocaleString()}</div><div class="lbl">Miles (7d)</div></div>
            <div class="kpi"><div class="val ${codesClass}">${s.vehicles_with_codes}</div><div class="lbl">w/ Codes</div></div>
            <div class="kpi"><div class="val ${s.drivers_need_coaching > 0 ? 'r' : 'g'}">${s.drivers_need_coaching}</div><div class="lbl">Need Coaching</div></div>
            <div class="kpi"><div class="val o">${(s.total_wo_completed || 0).toLocaleString()}</div><div class="lbl">WOs Done</div></div>
        </div>`;

        // ── Row 2: Tech Performance (span 2) + Alerts/Equipment ──
        // Tech Performance
        html += `<div class="card" style="grid-column: span 2;">
            <h2>👷 Tech Performance (7 Days)</h2>
            <div class="card-body">
            <table><thead><tr><th>Tech</th><th>Truck</th><th>Safety</th><th>Miles</th><th>Brakes</th><th>Accels</th><th>WOs</th><th>Status</th></tr></thead><tbody>`;

        d.tech_performance.forEach(t => {
            const rc = t.status === 'coach' ? 'crit' : t.status === 'monitor' ? 'warn' : '';
            const sc = t.safety_score >= 80 ? 'g' : t.safety_score >= 50 ? 'y' : 'r';
            html += `<tr class="${rc}">
                <td><strong>${t.driver || 'Unassigned'}</strong></td>
                <td>${t.nickname}</td>
                <td class="${sc}">${t.safety_score}</td>
                <td>${t.total_miles}</td>
                <td>${t.hard_brakes}</td>
                <td>${t.rapid_accels}</td>
                <td>${t.wo_completed || '—'}</td>
                <td><span class="badge ${t.status}">${t.status === 'good' ? '✓' : t.status === 'monitor' ? '⚠' : '✗'}</span></td>
            </tr>`;
        });

        html += `</tbody></table></div></div>`;

        // Alerts + Equipment column
        html += `<div class="card"><h2>🚨 Alerts</h2><div class="card-body">`;
        if (d.alerts && d.alerts.length > 0) {
            d.alerts.forEach(a => {
                html += `<div class="alert ${a.severity}"><strong>${a.type === 'vehicle' ? '🔧' : '👤'} ${a.title}</strong><span>${a.detail}</span></div>`;
            });
        } else {
            html += '<div style="color:#3fb950;text-align:center;padding:20px;">✅ No alerts</div>';
        }
        html += `</div></div>`;

        // ── Row 3: Fleet Status (span 2) + Equipment ──
        html += `<div class="card" style="grid-column: span 2;">
            <h2>🚛 Fleet Status</h2>
            <div class="card-body">
            <table><thead><tr><th>Vehicle</th><th>Driver</th><th>Fuel</th><th>Battery</th><th>Odometer</th><th>Codes</th><th>Status</th></tr></thead><tbody>`;

        d.vehicles.forEach(v => {
            const rc = v.status === 'service' ? 'crit' : v.status === 'monitor' ? 'warn' : '';
            const bc = parseFloat(v.battery_volts) < 12.0 ? 'r' : parseFloat(v.battery_volts) < 12.4 ? 'y' : 'g';
            const cc = v.trouble_code_count > 5 ? 'r' : v.trouble_code_count > 0 ? 'y' : 'g';
            html += `<tr class="${rc}">
                <td><strong>${v.nickname}</strong></td>
                <td>${v.driver || '—'}</td>
                <td>${v.fuel_level !== null ? v.fuel_level + '%' : '—'}</td>
                <td class="${bc}">${v.battery_volts}v</td>
                <td>${v.odometer?.toLocaleString() || '—'}</td>
                <td class="${cc}">${v.trouble_code_count}</td>
                <td><span class="badge ${v.status}">${v.status === 'good' ? '✓' : v.status === 'monitor' ? '⚠' : '🔧'}</span></td>
            </tr>`;
        });

        html += `</tbody></table></div></div>`;

        // Equipment
        html += `<div class="card"><h2>🔧 Equipment</h2><div class="card-body"><div class="blower-grid">`;
        d.blowers.forEach(b => {
            const cls = b.issue && b.issue.length > 0 ? 'issue' : '';
            html += `<div class="blower-item ${cls}">${b.tech}: ${b.model}${cls ? ' ⚠️' : ''}</div>`;
        });
        html += `</div></div></div>`;

        document.getElementById('dashboard').innerHTML = html;
    }

    load();
    setInterval(load, 5 * 60 * 1000);
    </script>
    <script src="navigator.js"></script>
</body>
</html>
